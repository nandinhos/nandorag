                    - generic [ref=f1e368]: 6 / 79 CAA – GESTÃO PATRIMONIAL NO COMAER EEAR
                    - generic [ref=f1e369]: APRESENTAÇÃO
                    - generic [ref=f1e370]: Prezado(a) aluno(a), parabéns por sua matrícula no Curso de Aperfeiçoamento Avançado
                    - generic [ref=f1e371]: (CAA). Trata-se de um grande momento em sua carreira.
                    - generic [ref=f1e372]: Possivelmente, você já teve contato com parte dos assuntos que serão tratados nesta
                    - generic [ref=f1e373]: apostila, entretanto, o que se pretende é sistematizar este conhecimento de forma a capacitá-lo para
                    - generic [ref=f1e374]: exercer as atribuições de um graduado em sua posição hierárquica, em que serão exigidos conhecimentos
                    - generic [ref=f1e375]: e habilidades para assessorar superiores e orientar equipes compostas por militares mais modernos.
                    - generic [ref=f1e376]: Estudaremos no primeiro capítulo os aspectos do orçamento, o plano plurianual, a lei de
                    - generic [ref=f1e377]: diretrizes orçamentárias, a lei orçamentária anual e a lei de responsabilidade fiscal. Além disso, veremos a
                    - generic [ref=f1e378]: origem do recurso público, o processo legislativo orçamentário, as transferências, a elaboração da
                    - generic [ref=f1e379]: proposta orçamentária e a formação de orçamento na Força Aérea Brasileira (FAB).
                    - generic [ref=f1e380]: No segundo capítulo, abordaremos os aspectos da licitação, dos princípios, das
                    - generic [ref=f1e381]: modalidades e tipos de licitação, do procedimento para abertura de processo licitatório e as características
                    - generic [ref=f1e382]: de compras na administração pública.
                    - generic [ref=f1e383]: No terceiro capítulo, estudaremos um pouco da execução da despesa e seus estágios. Na
                    - generic [ref=f1e384]: sequência, seguiremos para o capítulo 4 trabalhando os conceitos envolvidos nas irregularidades
                    - generic [ref=f1e385]: administrativas, em especial sobre o processo administrativo de apuração de irregularidades.
                    - generic [ref=f1e386]: No quinto capítulo, estudaremos os conceitos iniciais sobre o patrimônio, as variações
                    - generic [ref=f1e387]: patrimoniais e a avaliação patrimonial. Veremos também a depreciação, a amortização.
                    - generic [ref=f1e388]: No sexto capítulo, trataremos dos bens móveis de consumo, dos bens móveis de consumo
                    - generic [ref=f1e389]: de uso duradouro, dos bens intangíveis e dos bens permanentes, apresentando o processo de escrituração
                    - generic [ref=f1e390]: de cada um deles.
                    - generic [ref=f1e391]: Por fim, estudaremos no sétimo capítulo as movimentações de procedimentos para o
                    - generic [ref=f1e392]: desfazimento e alienação de bens móveis permanentes no Comando da Aeronáutica (COMAER).
                    - generic [ref=f1e393]: Votos de sucesso em seus estudos!
                    - generic [ref=f1e394]: EEAR – DIVISÃO DE ENSINO DE PÓS-FORMAÇÃO (DEPF)
                    - generic [ref=f1e395]: ESTRUTURA DA DISCIPLINA
                    - generic [ref=f1e396]: A disciplina “Gestão Patrimonial no COMAER”, pertencente ao Campo Técnico
                    - generic [ref=f1e397]: "Especializado e à área de Ciências Sociais Aplicadas, tem como objetivos específicos:"
                    - generic [ref=f1e398]: a) Identificar o orçamento público, seus instrumentos, planejamento e algumas leis.
                    - generic [ref=f1e399]: (Cp)
                    - generic [ref=f1e400]: b) Apontar os princípios básicos e norteadores das Licitações na Lei Orçamentária
                    - generic [ref=f1e401]: Anual (LOA) para a Aeronáutica. (Cn)
                    - generic [ref=f1e402]: c) Indicar a execução orçamentária e seus estágios no cumprimento da Lei
                    - generic [ref=f1e403]: Orçamentária Anual (LOA) para a Aeronáutica. (Cn)
                    - generic [ref=f1e404]: d) Identificar o processo administrativo de apuração de irregularidades no âmbito
                    - generic [ref=f1e405]: do COMAER. (Cp)
                    - generic [ref=f1e406]: e) Identificar os principais aspectos de bens patrimoniais na Força Aérea Brasileira.
                    - generic [ref=f1e407]: (Cp)
                    - generic [ref=f1e408]: Buscando atingir os objetivos específicos, a disciplina contará com as seguintes
                    - generic [ref=f1e409]: "unidades didáticas:"
