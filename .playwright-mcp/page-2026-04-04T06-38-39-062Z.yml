                    - generic [ref=f1e1542]: 5.2 VARIAÇÕES E AVALIAÇÃO PATRIMONIAL
                    - generic [ref=f1e1543]: a) VARIAÇÕES PATRIMONIAIS
                    - generic [ref=f1e1544]: O MCASP define que as variações patrimoniais aumentativas (VPA) e diminutivas (VPD)
                    - generic [ref=f1e1545]: são transações que promovem alterações nos elementos patrimoniais da entidade do setor público que
                    - generic [ref=f1e1546]: afetam o resultado.
                    - generic [ref=f1e1547]: "- Variação Patrimonial Aumentativa"
                    - generic [ref=f1e1548]: Corresponde a aumentos na situação patrimonial líquida da entidade não oriundos de
                    - generic [ref=f1e1549]: contribuições dos proprietários.
                    - generic [ref=f1e1550]: "O reconhecimento do VPA pode ocorrer em três momentos: antes, depois ou no momento"
