                    - generic [ref=f1e1553]: que ingressam durante o exercício e que aumentam o saldo financeiro da instituição. Instrumento por
                    - generic [ref=f1e1554]: meio do qual se viabiliza a execução das políticas públicas, cuja finalidade precípua é atender às
                    - generic [ref=f1e1555]: necessidades públicas e demandas da sociedade.
                    - generic [ref=f1e1556]: "- Variação Patrimonial Diminutiva"
                    - generic [ref=f1e1557]: Corresponde a diminuições na situação patrimonial líquida da entidade não oriundas de
                    - generic [ref=f1e1558]: distribuições aos proprietários.
                    - generic [ref=f1e1559]: "A VPD pode ocorrer em três momentos: antes, depois ou no momento da liquidação da"
                    - generic [ref=f1e1560]: despesa orçamentária.
