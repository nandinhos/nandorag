                    - generic [ref=f1e1654]: extrema importância o controle dos bens móveis por parte das UGs do COMAER.
                    - generic [ref=f1e1655]: O RCA 12-1 – “Regulamento de Administração da Aeronáutica, na forma eletrônica
                    - generic [ref=f1e1656]: (RADA-e)” – prevê que a manutenção dos bens patrimoniais, móveis, imóveis ou intangíveis são de
                    - generic [ref=f1e1657]: responsabilidade da UG, que mantém a sua guarda, conforme as normas contidas no RADA-e e nas
                    - generic [ref=f1e1658]: demais legislações pertinentes à administração de bens patrimoniais, no âmbito do COMAER.
                    - generic [ref=f1e1659]: "Na União, os bens patrimoniais se dividem, quanto a sua natureza, dividem-se em:"
