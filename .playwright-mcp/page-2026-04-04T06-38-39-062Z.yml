                    - generic [ref=f1e1562]: entes públicos para o funcionamento e manutenção dos serviços públicos prestados à sociedade.
                    - generic [ref=f1e1563]: b) AVALIAÇÃO PATRIMONIAL
                    - generic [ref=f1e1564]: De acordo o MCASP, Avaliação Patrimonial é a atribuição de valor monetário a itens do
                    - generic [ref=f1e1565]: ativo e do passivo, decorrentes de julgamento fundamentado em consenso entre as partes e que traduza,
                    - generic [ref=f1e1566]: com razoabilidade, a evidenciação dos atos e dos fatos administrativos.
