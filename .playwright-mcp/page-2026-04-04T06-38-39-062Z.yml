                    - generic [ref=f1e414]: 5) Bens patrimoniais na Força Aérea Brasileira.
                    - generic [ref=f1e415]: EEAR CAA – GESTÃO PATRIMONIAL NO COMAER 9 /79
                    - generic [ref=f1e416]: 1 ORÇAMENTO PÚBLICO
                    - generic [ref=f1e417]: 1.1 CONCEITOS INICIAIS
                    - generic [ref=f1e418]: Para iniciarmos a disciplina, neste primeiro capítulo estudaremos os
                    - generic [ref=f1e419]: aspectos do orçamento, do plano plurianual, da lei de diretrizes
                    - generic [ref=f1e420]: orçamentárias, da lei orçamentária anual e da lei da responsabilidade
