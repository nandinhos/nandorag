                    - generic [ref=f1e429]: Alerta! respectivo assunto.
                    - generic [ref=f1e430]: Orçamento nada mais é do que um instrumento de planejamento de utilização das
                    - generic [ref=f1e431]: receitas para suprimento de despesas em uma dada periodicidade. Analogamente ao o que ocorre na
                    - generic [ref=f1e432]: vida pessoal, na esfera governamental, também há a necessidade de gerência sobre a arrecadação e
                    - generic [ref=f1e433]: aplicação dos recursos.
                    - generic [ref=f1e434]: Para isso, a fim de garantir que o recurso seja bem aplicado e atinja o objetivo de
                    - generic [ref=f1e435]: atender ao interesse público, a “administração tem o dever de executar as programações
                    - generic [ref=f1e436]: orçamentárias, adotando os meios e as medidas necessários, com o propósito de garantir a efetiva
                    - generic [ref=f1e437]: entrega de bens e serviços à sociedade”, segundo o parágrafo 10 do art. 165 da Constituição
                    - generic [ref=f1e438]: Federal. (BRASIL, 1988).
