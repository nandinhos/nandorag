                    - generic [ref=f1e423]: orçamentária e a formação de orçamento na FAB.
                    - generic [ref=f1e424]: Ao final do capítulo, você deverá ser capaz de apresentar o orçamento
                    - generic [ref=f1e425]: público, seus instrumentos, planejamento e algumas leis.
                    - generic [ref=f1e426]: Os conteúdos descritos nesta apostila possuem finalidade didática. Para
