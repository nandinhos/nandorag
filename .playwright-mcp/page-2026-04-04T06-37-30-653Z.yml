DOS BENS MÓVEIS PERMANENTES............................................................................................................................... 68 7.1 ALIENAÇÃO DE BENS MÓVEIS PERMANENTES...............................................................70 8 CONCLUSÃO.................................................................................................................................75 9 REFERÊNCIAS.............................................................................................................................. 77 6 / 79 CAA – GESTÃO PATRIMONIAL NO COMAER EEAR APRESENTAÇÃO Prezado(a) aluno(a), parabéns por sua matrícula no Curso de Aperfeiçoamento Avançado (CAA). Trata-se de um grande momento em sua carreira. Possivelmente, você já teve contato com parte dos assuntos que serão tratados nesta apostila, entretanto, o que se pretende é sistematizar este conhecimento de forma a capacitá-lo para exercer as atribuições de um graduado em sua posição hierárquica, em que serão exigidos conhecimentos e habilidades para assessorar superiores e orientar equipes compostas por militares mais modernos. Estudaremos no primeiro capítulo os aspectos do orçamento, o plano plurianual, a lei de diretrizes orçamentárias, a lei orçamentária anual e a lei de responsabilidade fiscal. Além disso, veremos a origem do recurso público, o processo legislativo orçamentário, as transferências, a elaboração da proposta orçamentária e a formação de orçamento na Força Aérea Brasileira (FAB). No segundo capítulo, abordaremos os aspectos da licitação, dos princípios, das modalidades e tipos de licitação, do procedimento para abertura de processo licitatório e as características de compras na administração pública. No terceiro capítulo, estudaremos um pouco da execução da despesa e seus estágios. Na sequência, seguiremos para o capítulo 4 trabalhando os conceitos envolvidos nas irregularidades administrativas, em especial sobre o processo administrativo de apuração de irregularidades. No quinto capítulo, estudaremos os conceitos iniciais sobre o patrimônio, as variações patrimoniais e a avaliação patrimonial. Veremos também a depreciação, a amortização. No sexto capítulo, trataremos dos bens móveis de consumo, dos bens móveis de consumo de uso duradouro, dos bens intangíveis e dos bens permanentes, apresentando o processo de escrituração de cada um deles. Por fim, estudaremos no sétimo capítulo as movimentações de procedimentos para o desfazimento e alienação de bens móveis permanentes no Comando da Aeronáutica (COMAER). Votos de sucesso em seus estudos! EEAR – DIVISÃO DE ENSINO DE PÓS-FORMAÇÃO (DEPF) ESTRUTURA DA DISCIPLINA A disciplina “Gestão Patrimonial no COMAER”, pertencente ao Campo Técnico Especializado e à área de Ciências Sociais Aplicadas, tem como objetivos específicos: a) Identificar o orçamento público, seus instrumentos, planejamento e algumas leis. (Cp) b) Apontar os princípios básicos e norteadores das Licitações na Lei Orçamentária Anual (LOA) para a Aeronáutica. (Cn) c) Indicar a execução orçamentária e seus estágios no cumprimento da Lei Orçamentária Anual (LOA) para a Aeronáutica. (Cn) d) Identificar o processo administrativo de apuração de irregularidades no âmbito do COMAER. (Cp) e) Identificar os principais aspectos de bens patrimoniais na Força Aérea Brasileira. (Cp) Buscando atingir os objetivos específicos, a disciplina contará com as seguintes unidades didáticas: 1) Orçamento público; 2) Licitação; 3) Execução orçamentária; 4) Irregularidades administrativas; e 5) Bens patrimoniais na Força Aérea Brasileira. EEAR CAA – GESTÃO PATRIMONIAL NO COMAER 9 /79 1 ORÇAMENTO PÚBLICO 1.1 CONCEITOS INICIAIS Para iniciarmos a disciplina, neste primeiro capítulo estudaremos os aspectos do orçamento, do plano plurianual, da lei de diretrizes orçamentárias, da lei orçamentária anual e da lei da responsabilidade fiscal. Além disso, veremos a origem do recurso público, o processo legislativo orçamentário, as transferências, a elaboração da proposta orçamentária e a formação de orçamento na FAB. Ao final do capítulo, você deverá ser capaz de apresentar o orçamento público, seus instrumentos, planejamento e algumas leis. Os conteúdos descritos nesta apostila possuem finalidade didática. Para a realização das atividades nas diversas Organizações Militares da FAB devem ser observadas as legislações e ordens em vigor sobre o Alerta! respectivo assunto. Orçamento nada mais é do que um instrumento de planejamento de utilização das receitas para suprimento de despesas em uma dada periodicidade. Analogamente ao o que ocorre na vida pessoal, na esfera governamental, também há a necessidade de gerência sobre a arrecadação e aplicação dos recursos. Para isso, a fim de garantir que o recurso seja bem aplicado e atinja o objetivo de atender ao interesse público, a “administração tem o dever de executar as programações orçamentárias, adotando os meios e as medidas necessários, com o propósito de garantir a efetiva entrega de bens e serviços à sociedade”, segundo o parágrafo 10 do art. 165 da Constituição Federal. (BRASIL, 1988). Assim, partindo da premissa que a demanda de necessidades é muito maior que a quantidade de recursos, o governo necessita realizar a aplicação de seus recursos arrecadados de acordo com uma pré-definida priorização de ações, por meio de um adequado planejamento orçamentário. EEAR – DIVISÃO DE ENSINO DE PÓS-FORMAÇÃO (DEPF) 10 / 79 CAA – GESTÃO PATRIMONIAL NO COMAER EEAR Existem instrumentos utilizados no processo de elaboração do Orçamento Público (planejamento orçamentário), entre os quais podemos destacar a aprovação da Lei do Plano Plurianual (PPA), da Lei de Diretrizes Orçamentárias (LDO) e da Lei Orçamentária Anual (LOA). 1.2 PLANO PLURIANUAL O primeiro estágio para a elaboração do orçamento público é a elaboração do PPA (Plano Plurianual) que visa, estabelecer “de forma regionalizada, as diretrizes, os objetivos e as metas da administração pública federal para as despesas de capital e outras delas decorrentes e para as relativas aos programas de duração continuada”, segundo o parágrafo 1º do inciso III do art. 165 da Constituição Federal. (BRASIL, 1988). A ideia principal do PPA é ser um plano abrangente que identifique e planeje as ações estratégicas e metas prioritárias durante 4 (quatro) anos. Vale destacar que tal planejamento vale por 3 anos da gestão que o elaborou e mais um ano da gestão seguinte, ou seja, o PPA tem vigência a partir do segundo ano do mandato do Poder Executivo que o elaborou até o final do primeiro ano do mandato seguinte, proporcionando continuidade aos atos de planejamento gestão passada. A proposta do PPA é confeccionada pelo Poder Executivo e deve ser encaminhada para aprovação até 4 (quatro) meses antes do encerramento do primeiro exercício financeiro do mandato vigente (31 de agosto) e deve ser aprovada pelo Poder Legislativo até o início do recesso parlamentar de final de ano (22 de dezembro). 1.3 LEI DE DIRETRIZES ORÇAMENTÁRIAS Após a aprovação do PPA, o próximo passo é a elaboração da LDO (Lei de Diretrizes Orçamentárias) cuja responsabilidade de envio do Projeto de Lei também é do Poder Executivo e que é deliberado pelo Congresso Nacional. O prazo do Poder Executivo para envio do PLDO é de até oito meses e meio antes do encerramento do exercício financeiro (15 de abril) e o Congresso Nacional tem até o encerramento do primeiro período da sessão legislativa (17 de julho) para discutir e votar. A LDO propriamente dita é a lei que define as metas e prioridades do orçamento para o ano seguinte à sua aprovação, além de, dentre outros, trazer as definições de limites de despesa dentre os Poderes na esfera Federal, traçar regras a fim de fixar montantes de recursos a serem economizados, algumas obrigações de transparência, além de vedações ou autorizações de despesas com pessoal. E, como forma de entregar essa transparência à sociedade, é possível consultar EEAR – DIVISÃO DE ENSINO DE PÓS-FORMAÇÃO (DEPF) EEAR CAA – GESTÃO PATRIMONIAL NO COMAER 11 /79 informações sobre a execução do orçamento público no Portal da Transparência do Governo Federal. Portal da Transparência do Governo Federal Veja isto! www.portaltransparencia.gov.br Todos os tópicos aprovados na LDO devem ser considerados na elaboração e na execução da Lei Orçamentária Anual – LOA (que será melhor detalhada a seguir). 1.4 LEI ORÇAMENTÁRIA ANUAL A partir da LDO, ocorre a elaboração da LOA (Lei Orçamentária Anual) a qual nada mais é do que o detalhamento dos gastos do Governo. A LOA versa sobre a origem, a estimativa do total da arrecadação e o rumo dos recursos a serem aplicados no país com fins de atendimento aos objetivos traçados no PPA e na LDO. Para tal, esta lei traça a previsão de arrecadação tributária, retornos financeiros de empréstimos, ou qualquer outra fonte que possa compor a receita durante o ano. Assim, após a previsão do montante da receita, há a fixação da despesa máxima estabelecendo o teto de gastos. O Poder Executivo é o responsável pelo envio do Projeto de Lei Orçamentária Anual (PLOA) a qual deve seguir para análise do Congresso Nacional até 4 (quatro) meses antes do encerramento do exercício financeiro (31 de agosto de cada ano). Ao Congresso cabe a tarefa de discutir e votar o orçamento até o dia 22 de dezembro de cada ano. 1.5 LEI DE RESPONSABILIDADE FISCAL O PPA, a LDO e a LOA, conforme supracitado, são os principais instrumentos para o planejamento orçamentário. E, para a correta aplicação da receita pública, conforme fixado na LOA e visando o cumprimento dos objetivos instituídos no PPA, existe uma série de outras normas que garantem a aplicação dos recursos da forma mais eficiente, eficaz e efetiva. Essas normas estão previstas em numerosas leis, sendo uma das mais importantes a Lei Complementar nº 101, de 04 de maio de 2000, chamada de Lei de Responsabilidade Fiscal – LRF. (BRASIL, 2000). A LRF foi aprovada pelo Congresso Nacional no ano 2000 e estabelece um conjunto de regras voltadas para a boa gestão das finanças públicas. A LRF tem como objetivo garantir a EEAR – DIVISÃO DE ENSINO DE PÓS-FORMAÇÃO (DEPF) 12 / 79 CAA – GESTÃO PATRIMONIAL NO COMAER EEAR sobrevivência e o controle das contas públicas, preservando a saúde fiscal do Governo. Com esse fim, a LRF traz a obrigatoriedade de fixar metas fiscais na LDO e consequente infrações contra a lei, em caso de descumprimento. Sendo assim, são definidas metas para as receitas, para as despesas, para a diferença entre elas, para a dívida etc. Essas metas são deliberadas no planejamento do governo, com o objetivo de garantir o cumprimento de obrigações, execução do orçamento de forma planejada, evitar despesas continuadas com fontes de receitas vulneráveis, entre outros. Uma contribuição importante que a LRF trouxe foi a de obrigar o Poder Executivo avaliar o comportamento das receitas e despesas periodicamente, para medir se o orçamento do país deve expandir, manter o ritmo ou reduzir (contingenciar). A LDO estabelece que essa avaliação deve ocorrer nos meses ímpares do ano. Assim, os recursos disponibilizados para as despesas podem sofrer alterações nesses marcos. ➔ Procure no conteúdo estudado as palavras-chave que melhor representam o que foi estudado até aqui. ➔ Faça uma lista dessas palavras-chave seguida de um breve comentário. ➔ A partir da leitura delas, tente reconstruir o que foi Vamos fazer visto. algumas anotações! 1.6 ORIGEM DO RECURSO PÚBLICO Os recursos públicos têm como principal fonte originária os tributos cobrados à sociedade, tais como impostos, taxas e contribuições. Além disso, existem outras fontes de recurso, como aluguéis e venda de bens, prestação de serviços, vendas de títulos do Tesouro Nacional, empréstimos etc. Como forma de organizar toda a receita arrecadada, o Governo classifica a receita de acordo com cada fonte de origem do recurso. Cabe destacar, que não é possível chegar a um valor exato de receita uma vez que varia de acordo com a arrecadação em cada fonte as quais sofrem variações. Ou seja, o governo pode arrecadar mais ou menos do que o estimado. É responsabilidade de cada ente público (União, Estados, DF e municípios) criar, estimar e arrecadar os tributos sob sua competência, seguindo as normas previstas na LRF. EEAR – DIVISÃO DE ENSINO DE PÓS-FORMAÇÃO (DEPF) EEAR CAA – GESTÃO PATRIMONIAL NO COMAER 13 /79 1.7 PROCESSO LEGISLATIVO ORÇAMENTÁRIO Conforme relatado anteriormente, na União, os projetos/propostas referentes ao PPA, LDO e LOA são encaminhados pelo Poder Executivo ao Congresso Nacional. Essas proposições são, então, apreciadas e aprovadas pelo Congresso. No Brasil, cada ente da Federação tem seu próprio PPA, sua própria LDO e por conseguinte sua própria LOA, ou seja, a União, cada estado, o DF e cada município também elaboram seus próprios orçamentos, estimando a arrecadação e as despesas, tudo baseado na arrecadação dos impostos recolhidos pelos entes. Conforme visto anteriormente, todas as leis orçamentárias são de autoria do Poder Executivo, o qual remete para o Poder Legislativo (Congresso Nacional, Assembleia Legislativa ou Câmara Municipal) que por sua vez analisa e vota os projetos do PPA, da LDO e da LOA. 1.8 ELABORAÇÃO DA PROPOSTA ORÇAMENTÁRIA Percebemos que a criação do orçamento ocorre em etapas: a cada quatro anos é elaborado o PPA, anualmente, a LDO e a LOA. Tratando especificamente da LOA, a elaboração dessa proposta orçamentária depende da meta fiscal fixada na LDO, essa meta tem o objetivo de apurar o resultado primário (diferença entre receitas e despesas) para o exercício, ou seja, o governo não deve gastar mais do que arrecadar, garantindo, assim, condições de o país crescer ou se manter estável. Após o levantamento estimado das receitas arrecadadas, desconta-se a meta fiscal fixada na LDO tendo como resultado a quantidade de recurso disponível para aplicação nas despesas do governo, as quais podem ser classificadas em obrigatórias, prioritárias e discricionárias. As despesas obrigatórias são as maiores do governo e são aquelas previstas na Constituição Federal e demais legislações como, por exemplo, o pagamento dos benefícios previdenciários. Após, reservado os recursos para o pagamento de tais despesas, o próximo passo é identificar as despesas prioritárias que são as estabelecidas na LDO como “preferenciais”; estas terão prevalência sobre as outras, caso haja a necessidade de algum corte de gastos. Dessa maneira, se o governo necessitar economizar, as despesas discricionárias serão as mais afetadas. Feito esse levantamento, os entes federais encaminham ao Ministério do Planejamento e Orçamento, mais especificamente à Secretaria de Orçamento Federal (SOF), suas propostas contendo as despesas obrigatórias, prioritárias e discricionárias sob sua responsabilidade, EEAR – DIVISÃO DE ENSINO DE PÓS-FORMAÇÃO (DEPF) 14 / 79 CAA – GESTÃO PATRIMONIAL NO COMAER EEAR para o ano seguinte. A SOF é responsável por analisar as projeções de receitas e despesas, unificando-as no projeto de LOA e submetendo à Presidência da República. Após termos visto a relação entre as Leis que estabelecem o orçamento e a elaboração da proposta orçamentária, tudo começa a ter mais sentido, não é mesmo? Mas como o Orçamento é trabalhado no COMAER? 1.9 FORMAÇÃO DE ORÇAMENTO E A FAB Cabe ao Estado-Maior da Aeronáutica (EMAER) a coordenação do processo de elaboração da Proposta do Plano de Ação (PA), documento que consolida e aloca todos os recursos previstos na Lei Orçamentária Anual (LOA) para a Aeronáutica. Alterações que venham ocorrer após a publicação da LOA, em decorrência do Decreto de Programação Orçamentária e Financeira (DPOF) e que geram impacto no PA, serão implementadas pelo EMAER e comunicadas aos Órgãos de Direção Setorial (ODS) e de Assistência Direta e Imediata ao Comandante da Aeronáutica (ODSA), por intermédio dos seus setores de planejamento, orçamento e gestão, e aos Agentes Responsáveis, designados legalmente, via Portaria. Para tanto, cabe à Quinta Subchefia do Estado-Maior da Aeronáutica (5SC/EMAER) a coleta e consolidação das necessidades de recursos orçamentários, tarefa que pode ser realizada por intermédio do Sistema de Planejamento e Orçamento (SIPLORC) ou outro sistema informatizado que venha a substituí-lo. O ponto de partida de todo o processo é o encaminhamento, via SIPLORC, das necessidades de recursos creditícios pelos Agentes Responsáveis das diversas Unidades Gestoras, de forma a serem analisadas e consolidadas no âmbito do EMAER Após o recebimento do Limite Orçamentário estabelecido pela SOF para o MD, este órgão promove o seu rateio entre as três Forças Armadas e a Administração do próprio Ministério. Definido o Limite Orçamentário para a Aeronáutica, o EMAER adequa as necessidades das Unidades Gestoras aos limites estipulados e insere a Proposta Orçamentária do COMAER no Sistema Integrado de Planejamento e Orçamento (SIOP), para apreciação do MD e, em seguida, envia à SOF, que oportunamente consolida a proposta do Poder Executivo com as dos demais Poderes para a elaboração do Projeto de Lei Orçamentária Anual (PLOA). EEAR – DIVISÃO DE ENSINO DE PÓS-FORMAÇÃO (DEPF) EEAR CAA – GESTÃO PATRIMONIAL NO COMAER 15 /79 O Poder Executivo, então, entrega o Projeto de Lei ao Congresso Nacional, onde Deputados e Senadores, por meio da Comissão Mista de Planos, Orçamentos Públicos e Fiscalização (CMO), analisam e emitem parecer sobre a proposta enviada, acrescentando alterações que julgarem pertinentes. Após aprovação em sessão plenária, o Orçamento é aprovado pelo Presidente da República, transformando-se na LOA. No âmbito do COMAER, o planejamento se encerra com a aprovação do Comandante da Aeronáutica (CMTAER) no Plano de Ação (PA), documento que consolida e atribui a cada Organização Militar todos os recursos previstos para a Aeronáutica, na LOA. Nesse cenário, o processo orçamentário do COMAER torna-se de enorme importância, uma vez que, estando integrado ao Plano Plurianual (PPA), à Estratégia Nacional de Defesa (END), ao Plano Estratégico Militar da Aeronáutica (PEMAER), à Diretriz de Planejamento Institucional (DIPLAN) e aos Planos Setoriais dos ODSA (PLANSET), viabiliza a concretização dos anseios da Força Aérea Brasileira, dando vida aos Projetos e Atividades desenvolvidos por todas as Organizações Militares do COMAER. EEAR – DIVISÃO DE ENSINO DE PÓS-FORMAÇÃO (DEPF) 16 / 79 CAA – GESTÃO PATRIMONIAL NO COMAER EEAR ➔ Procure no conteúdo estudado as palavras-chave que melhor representam o que foi estudado até aqui. ➔ Faça uma lista dessas palavras-chave seguida de um breve comentário. Vamos fazer algumas ➔ A partir da leitura delas, tente reconstruir o que foi anotações! visto. Parabéns por ter avançado até aqui! Está na hora de fazer uma pausa. Lembre-se de que o descanso e a reflexão fazem parte do Agora, que tal uma estudo. pausa? A partir de suas anotações, reconstrua, com suas palavras, todo o estudo em um ou dois parágrafos, ou, se preferir, elabore um mapa mental ou um infográfico sobre o texto. Está na hora de resumir! EEAR – DIVISÃO DE ENSINO DE PÓS-FORMAÇÃO (DEPF) EEAR CAA – GESTÃO PATRIMONIAL NO COMAER 17 /79 Exercícios para Aprendizagem do Capítulo Bem, agora que você já cumpriu uma etapa da missão, que tal avaliar seu grau de assimilação em relação ao conteúdo que foi visto neste capítulo? Não se preocupe caso não saiba responder prontamente. A proposta é que você consulte as suas anotações ou produza um debate com algum companheiro. Você pode usar o fórum entre pares no EEAR Virtual. O importante é que você resolva os exercícios abaixo. 1. Aprovada em 2000 pelo Congresso Nacional, a _________ estabelece regras voltadas para a boa gestão financeira com o objetivo de assegurar a sustentabilidade futura das contas públicas. Para tanto, estatui a necessidade de fixação de metas fiscais previstas em Lei, sob pena de incorrer em infração contra a lei de finanças públicas. A lacuna supracitada apenas estará correta se for preenchida com: a) LRF b) LOA c) PP