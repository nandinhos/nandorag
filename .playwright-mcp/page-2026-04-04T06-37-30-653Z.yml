                - textbox "Content" [disabled] [ref=e153]: "MINISTÉRIO DA DEFESA COMANDO DA AERONÁUTICA ESCOLA DE ESPECIALISTAS DE AERONÁUTICA CURSO DE APERFEIÇOAMENTO AVANÇADO GESTÃO PATRIMONIAL NO COMAER VOLUME ÚNICO CAA MINISTÉRIO DA DEFESA COMANDO DA AERONÁUTICA ESCOLA DE ESPECIALISTAS DE AERONÁUTICA CURSO DE APERFEIÇOAMENTO AVANÇADO GESTÃO PATRIMONIAL NO COMAER VOLUME ÚNICO Apostila da Disciplina Gestão Patrimonial no COMAER do Curso de Aprimoramento Avançado – CAA Edições(es): 7ª Edição: MJ QOINT GRACIELE ABRAHÃO – 2024 CP QOINT HEITOR – 2024 1T QOINT FELIPE – 2024 1T QOINT DAVID – 2025 1T QOINT RAFAEL – 2026 Revisor(es) Pedagógico(s): 1T QOCON PED VIEIRA – 2025 Revisor(es) Estilístico – gramatical: 2T QOCON MRM JAMILE – 2025 Revisor(es) de Diagramação: 2S QSS SAD ESTEVAN – 2026 GUARATINGUETÁ – SP 2026 DOCUMENTO DE PROPRIEDADE DA EEAR Todos os Direitos Reservados Nos termos da legislação sobre direitos autorais, é proibida a reprodução total ou parcial deste documento, utilizando-se de qualquer forma ou meio eletrônico ou mecânico, inclusive processos xerográficos de fotocópias e de gravação, sem a permissão, expressa e por escrito, da Escola de Especialistas de Aeronáutica – Guaratinguetá – SP. SUMÁRIO 1 ORÇAMENTO PÚBLICO................................................................................................................9 1.1 CONCEITOS INICIAIS.................................................................................................................9 1.2 PLANO PLURIANUAL.............................................................................................................. 10 1.3 LEI DE DIRETRIZES ORÇAMENTÁRIAS..............................................................................10 1.4 LEI ORÇAMENTÁRIA ANUAL................................................................................................11 1.5 LEI DE RESPONSABILIDADE FISCAL...................................................................................11 1.6 OR