O PATRIMONIAL NO COMAER EEAR 2.2 PERGUNTAS IMPORTANTES Em obediência ao que estabelece o Inc XXI do art 37 da CF, as contratações 1) POR QUE realizadas pela Administração Pública devem ser precedidas de licitação e que LICITAR? esta garanta a isonomia entre os interessados em contratar com a União. O espectro que as licitações abrangem no âmbito da Administração Federal, Estadual e Municipal é bem amplo. Com exceção aos específicos casos da lei 14.133/2021, podem ser adquiridos desde bens comuns, como lápis, borracha e 2) O QUE PODE papel sulfite, até a contratação de execução de obras complexas, (como SER LICITADO? edificações, hangares e estádios) ou a prestação de serviços (como serviços de limpeza ou serviço de manutenção preventiva em viaturas, por exemplo). Administração Pública, direta e indireta, de qualquer dos poderes da União, 3) QUEM DEVE Estados, DF e municípios, conforme inc. XXI do art. 37 da CF. LICITAR? Poderão participar aqueles interessados que atuem, comprovadamente, no ramo de atividade do objeto da Licitação e possuam os requisitos mínimos de habilitação, previstos no instrumento convocatório. Não podem participar aqueles que estejam, por algum motivo, envolvidos na confecção/condução do certame, bem como os impedidos de licitar com a 4) QUEM PODERÁ Administração ou aqueles declarados inidôneos para licitar ou contratar com a PARTICIPAR DA Administração. LICITAÇÃO? Já para casos de obras, adicionalmente, não podem participar aqueles que sejam autores, ou cuja empresa o autor do projeto básico ou executivo for dirigente, bem como não podem ser servidores ou dirigentes de órgão ou entidade contratante ou responsável pela licitação. De início, é necessária a realização da fase do Planejamento da Contratação, (consubstanciada em documentos específicos, que serão citados a seguir). É nesse momento também que deve ser feita a apuração da existência de recursos orçamentários suficientes para o pagamento da despesa, devendo esta estar de 5) COMO SE DEV