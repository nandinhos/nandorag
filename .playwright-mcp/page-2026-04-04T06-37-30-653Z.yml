os ao cidadão, feito através da ampla e irrestrita divulgação dos atos realizados pela Administração; f) PRINCÍPIO DA VINCULAÇÃO AO INSTRUMENTO CONVOCATÓRIO Tal princípio, como o próprio nome sugere, obriga tanto o licitante quanto a Administração a cumprirem os ditames constantes no ato convocatório (Edital); e g) PRINCÍPIO DO JULGAMENTO OBJETIVO Esse princípio impõe à Administração a obrigação de definir critério de aferição e que estes sejam preestabelecidos no Edital (ato convocatório), com o fim de evitar a subjetividade no julgamento pelo agente da administração. EEAR – DIVISÃO DE ENSINO DE PÓS-FORMAÇÃO (DEPF) 22 / 79 CAA – GESTÃO PATRIMONIAL NO COMAER EEAR Além dos princípios acima, existem alguns outros correlatos, sendo os seguintes os principais: ➢ PRINCÍPIO DA CELERIDADE Tal princípio visa a simplificar e reduzir os excessos de formalidades desnecessárias durante o certame, com vistas a promover maior agilidade nos atos administrativos; ➢ PRINCÍPIO DA COMPETITIVIDADE Esse princípio estabelece à Administração que esta sempre deve buscar o maior número de competidores para a participação de um dado certame, vedando estabelecer exigências e condições excessivas que possam, de alguma forma, frustrar ou restringir o caráter competitivo da licitação; e ➢ PRINCÍPIO DA SEGREGAÇÃO DE FUNÇÃO Conforme § 1º do art 7º da Lei 14.133/21, é vedada a designação do mesmo agente público para atuação simultânea em funções mais suscetíveis a riscos, de modo a reduzir a possibilidade de ocultação de erros e de ocorrência de fraudes na respectiva contratação. 2.4 MODALIDADES DA LICITAÇÃO A depender das peculiaridades do objeto a ser contratado, existem maneiras específicas de condução de uma licitação. Estes procedimentos são denominados de modalidades de licitação, que por sua vez, estão listadas no art. 28 da Lei 14.133/21. São elas: Pregão, Concorrência, Concurso, Leilão e Diálogo Competitivo: a) LEILÃO Conforme inc XL do art 6º, o Leilão é a modalidade de licitação para alienação de bens imóveis ou de bens móveis inservíveis ou legalmente apreendidos a quem oferecer o maior lance. Assim, podem participar quaisquer interessados na aquisição do objeto licitatório e sagra-se como “vencedor” aquele que der o maior lance, igual ou superior ao do valor da avaliação dos referidos materiais; b) CONCORRÊNCIA Em linhas gerais, é a modalidade de licitação para contratação de bens e serviços especiais e de obras e serviços comuns e especiais de engenharia, conforme inciso XXXVIII do art. 6º da Lei 14.133/21. Nessa modalidade, o critério de julgamento poderá ser: menor preço, melhor técnica ou conteúdo artístico, técnica e preço, maior retorno econômico ou maior desconto; EEAR – DIVISÃO DE ENSINO DE PÓS-FORMAÇÃO (DEPF) EEAR CAA – GESTÃO PATRIMONIAL NO COMAER 23 /79 c) PREGÃO Definida no inciso XIII do art. 6º, é a modalidade de licitação obrigatória para aquisição de bens e serviços comuns, que são aqueles cujos padrões de desempenho e qualidade podem ser objetivamente definidos pelo edital, por meio de especificações usuais de mercado. Os critérios de julgamento para esta modalidade podem ser: menor preço ou maior desconto. ➔ Os critérios de julgamento são excludentes entre si. Ou seja, uma licitação somente poderá adotar um critério de julgamento, em detrimento dos demais. Vamos fazer algumas anotações! d) DIÁLOGO COMPETITIVO Conforme definido no inciso XLII do art. 6º da Lei de Licitações, é modalidade de licitação para contratação de obras, serviços e compras em que a Administração Pública realiza diálogos com licitantes previamente selecionados mediante critérios objetivos, com o intuito de desenvolver uma ou mais alternativas capazes de atender às suas necessidades, devendo os licitantes apresentar proposta final após o encerramento dos diálogos. É restrita somente a contratações que visem contratação de inovações tecnológicas ou técnicas, impossibilidade de o órgão ou entidade ter sua necessidade satisfeita sem a adaptação de soluções disponíveis no mercado e impossibilidade de as especificações técnicas serem definidas com precisão suficiente pela Administração. e) CONCURSO Definida no inciso XXXIX do art. 6º como modalidade de licitação para escolha de trabalho técnico, científico ou artístico, cujo critério de julgamento será o de melhor técnica ou conteúdo artístico. É utilizada também para concessão de prêmio ou remuneração ao vencedor. EEAR – DIVISÃO DE ENSINO DE PÓS-FORMAÇÃO (DEPF) 24 / 79 CAA – GESTÃO PATRIMONIAL NO COMAER EEAR 2.5 PRAZO PARA APRESENTAÇÃO DE PROPOSTAS E LANCES A lei 14.1333/21, em seu art. 55, delimita os prazos mínimos para apresentação de propostas e lances, contados a partir da data de divulgação do edital de licitação. A seguir serão listadas os principais prazos: I – para aquisição de bens: a) 8 (oito) dias úteis, quando adotados os critérios de julgamento de menor preço ou de maior desconto; b) 15 (quinze) dias úteis, nas hipóteses não abrangidas pela alínea “a” deste inciso; II – no caso de serviços e obras: a) 10 (dez) dias úteis, quando adotados os critérios de julgamento de menor preço ou de maior desconto, no caso de serviços comuns e de obras e serviços comuns de engenharia; b) 25 (vinte e cinco) dias úteis, quando adotados os critérios de julgamento de menor preço ou de maior desconto, no caso de serviços especiais e de obras e serviços especiais de engenharia; c) 60 (sessenta) dias úteis, quando o regime de execução for de contratação integrada; e d) 35 (trinta e cinco) dias úteis, quando o regime de execução for o de contratação semi- integrada ou nas hipóteses não abrangidas pelas alíneas “a”, “b” e “c” deste inciso; III – para licitação em que se adote o critério de julgamento de maior lance, 15 (quinze) dias úteis; IV – para licitação em que se adote o critério de julgamento de técnica e preço ou de melhor técnica ou conteúdo artístico, 35 (trinta e cinco) dias úteis. § 1º Eventuais modificações no edital implicarão nova divulgação na mesma forma de sua divulgação inicial, além do cumprimento dos mesmos prazos dos atos e procedimentos originais, exceto quando a alteração não comprometer a formulação das propostas. EEAR – DIVISÃO DE ENSINO DE PÓS-FORMAÇÃO (DEPF) EEAR CAA – GESTÃO PATRIMONIAL NO COMAER 25 /79 ➔ Procure no conteúdo estudado as palavras-chave que melhor representam o que foi estudado até aqui. ➔ Faça uma lista dessas palavras-chave seguida de um breve comentário. Vamos fazer algumas anotações! ➔ A partir da leitura delas, tente reconstruir o que foi visto. 2.6 DISPENSA DE LICITAÇÃO Prevista no art. 75 da Lei 14.133/21, a Dispensa de licitação é a forma legal em que a Administração pode contratar sem a necessidade prévia de licitar. No entanto, por ser de caráter excepcional, só pode ser aplicada estritamente às situações previstas em lei. Mesmo não havendo uma licitação (ou seja, sendo uma exceção à regra), tal procedimento de contratação deverá obedecer aos devidos princípios licitatórios previstos no art. 5º da Lei de Licitações. As situações para utilização da Dispensa de Licitação são aquelas consideradas de baixo valor, conforme a seguir: I – para contratação que envolva valores inferiores a R$ 100.000,00 (cem mil reais), no caso de obras e serviços de engenharia ou de serviços de manutenção de veículos automotores II – para contratação que envolva valores inferiores a R$ 50.000,00 (cinquenta mil reais), no caso de outros serviços e compras; Ressalta-se que esses valores são atualizados anualmente por Decreto Presidencial. Tais processos são publicados no Portal Nacional de Compras Públicas, o qual é sítio eletrônico oficial destinado à divulgação centralizada e obrigatória dos atos exigidos pela Lei nº 14.133/2021, e normatizados pela Instrução Normativa SEGES/ME nº 67/2021, a qual dispõe sobre a Dispensa de Licitação na forma eletrônica. 2.7 PLANEJAMENTO DA CONTRATAÇÃO A Instrução Normativa SEGES/ME nº 98/2022 autorizou a utilização da Instrução Normativa nº 5 de 26 de maio de 2017 para contratação de serviços sob o regime de execução indireta EEAR – DIVISÃO DE ENSINO DE PÓS-FORMAÇÃO (DEPF) 26 / 79 CAA – GESTÃO PATRIMONIAL NO COMAER EEAR no âmbito da Administração Pública federal direta, autárquica e fundacional, no que couber, para a realização dos processos de licitação e de contratação direta de serviços de que dispõe a Lei nº 14.133, de 1º de abril de 2021. Assim, dentre os diversos elementos que compõem o planejamento da contratação, destacamos três principais etapas: Estudos Preliminares, Gerenciamentos de riscos e Termo de Referência, os quais serão pormenorizados a seguir. a) ESTUDOS TÉCNICOS PRELIMINARES (ETP) O planejamento da contratação tem início a partir da identificação de uma necessidade ou de um problema da Administração, a ser evidenciado no estudo técnico preliminar (ETP), que consiste no planejamento preliminar da contratação. O ETP possibilitará a indicação da solução mais adequada, entre as possíveis, para atender à necessidade da Administração, avaliando a viabilidade técnica e econômica da contratação ou das contratações necessárias para compor a solução (inclusive para os casos de contratação direta. Se a contratação for viável, a solução escolhida será especificada (ratificada ou complementada) no termo de referência (TR) ou no projeto básico (PB), que consiste no planejamento definitivo da contratação, juntamente com o edital de licitação. O ETP deverá ser elaborado conjuntamente por representantes da área técnica e da requisitante ou, quando houver, pela equipe de planejamento da contratação. Normatizado pela Instrução Normativa SEGES/ME nº 58/2022 para a Lei nº 14.133/21, possibilita a elaboração do documento denominado Estudo Técnico Preliminar (ETP), além de implantar o Sistema de ETP Digital. Deve contemplar as seguintes informações: I – descrição da necessidade da contratação, considerado o problema a ser resolvido sob a perspectiva do interesse público; II – descrição dos requisitos da contratação necessários e suficientes à escolha da solução, prevendo critérios e práticas de sustentabilidade, observadas as leis ou regulamentações específicas, bem como padrões mínimos de qualidade e desempenho; III – levantamento de mercado, que consiste na análise das alternativas possíveis, e justificativa técnica e econômica da escolha do tipo de solução a contratar, podendo, entre outras opções: EEAR – DIVISÃO DE ENSINO DE PÓS-FORMAÇÃO (DEPF) EEAR CAA – GESTÃO PATRIMONIAL NO COMAER 27 /79 a) ser consideradas contratações similares feitas por outros órgãos e entidades públicas, bem como por organizações privadas, no contexto nacional ou internacional, com objetivo de identificar a existência de novas metodologias, tecnologias ou inovações que melhor atendam às necessidades da Administração; b) ser realizada audiência e/ou consulta pública, preferencialmente na forma eletrônica, para coleta de contribuições; c) em caso de possibilidade de compra, locação de bens ou do acesso a bens, ser avaliados os custos e os benefícios de cada opção para escolha da alternativa mais vantajosa, prospectando-se arranjos inovadores em sede de economia circular; e d) ser consideradas outras opções logísticas menos onerosas à Administração, tais como chamamentos públicos de doação e permutas. IV – descrição da solução como um todo, inclusive das exigências relacionadas à manutenção e à assistência técnica, quando for o caso; V – estimativa das quantidades a serem contratadas, acompanhada das memórias de cálculo e dos documentos que lhe dão suporte, considerando a interdependência com outras contratações, de modo a possibilitar economia de escala; VI – estimativa do valor da contratação, acompanhada dos preços unitários referenciais, das memórias de cálculo e dos documentos que lhe dão suporte, que poderão constar de anexo classificado, se a Administração optar por preservar o seu sigilo até a conclusão da licitação; VII – justificativas para o parcelamento ou não da solução; VIII – contratações correlatas e/ou interdependentes; IX – demonstrativo da previsão da contratação no Plano de Contratações Anual, de modo a indicar o seu alinhamento com o instrumentos de planejamento do órgão ou entidade; X – demonstrativo dos resultados pretendidos, em termos de economicidade e de melhor aproveitamento dos recursos humanos, materiais e financeiros disponíveis; XI – providências a serem adotadas pela Administração previamente à celebração do contrato, tais como adaptações no ambiente do órgão ou da entidade, necessidade de obtenção de licenças, outorgas ou autorizações, capacitação de servidores ou de empregados para fiscalização e gestão contratual; EEAR – DIVISÃO DE ENSINO DE PÓS-FORMAÇÃO (DEPF) 28 / 79 CAA – GESTÃO PATRIMONIAL NO COMAER EEAR XII – descrição de possíveis impactos ambientais e respectivas medidas mitigadoras, incluídos requisitos de baixo consumo de energia e de outros recursos, bem como logística reversa para desfazimento e reciclagem de bens e refugos, quando aplicável; e XIII – posicionamento conclusivo sobre a adequação da contratação para o atendimento da necessidade a que se destina. Como forma de facilitar sua confecção foi elaborado um manual de elaboração deste Estudo, podendo ser encontrado no link: Manual do ETP Digital https://www.gov.br/compras/pt-br/acesso-a-informacao/ manuais/manual-fase-interna/manual-etp-digital-pdf/ Veja isto! manual-etp-versao-2.pdf NOTA: Importante observar que, apesar de a regra ser a obrigatoriedade, nem sempre o ETP será exigível. Para a Administração Pública federal direta, autárquica e fundacional do Poder Executivo, o ETP será dispensado na hipótese prevista no art. 75, inciso III, da Lei 14.133/2021 (dispensa por licitação frustrada), e nos casos de prorrogação contratual relativa a objeto de prestação de natureza continuada. Ademais, será facultado nas hipóteses do art. 75, incisos I, II, VII e VIII da referida Lei (dispensa de licitação por valor, dispensa por situação de guerra ou grave perturbação da ordem, dispensa por emergência ou calamidade pública), bem como no caso de contratação de remanescente de obra, serviço ou fornecimento, em consequência de rescisão contratual. As organizações da Administração Pública federal direta, autárquica e fundacional do Poder Executivo devem confeccionar o ETP no Sistema ETP Digital, no Portal de Compras do Governo Federal. EEAR – DIVISÃO DE ENSINO DE PÓS-FORMAÇÃO (DEPF) EEAR CAA – GESTÃO PATRIMONIAL NO COMAER 29 /79 b) GERENCIAMENTO DE RISCOS O estudo técnico preliminar já serve, naturalmente, ao gerenciamento de riscos da futura contratação. Cada etapa do estudo permite à equipe de planejamento antecipar problemas e prever oportunidades, orientando a tomada de decisão. Ao final do ETP, a equipe consegue avaliar a adequabilidade da solução escolhida ao atendimento da necessidade que desencadeou a contratação, dimensioná-la para o atendimento da necessidade (definir as quantidades da solução adequadamente), estimar os seus custos e benefícios, identificar as medidas necessárias para implementá-la, e concluir se é viável e justificável a sua contratação. No entanto, há riscos relevantes que não serão tratados no âmbito do ETP ou do planejamento definitivo (termo de referência/projeto básico e edital) e que, portanto, precisarão ser registrados durante o processo de planejamento e gerenciados ao longo dos processos de seleção do fornecedor e de gestão do contrato. Esses riscos podem estar relacionados ao processo licitatório (ou ao processo de contratação direta), às providências a serem adotadas pela Administração antes da celebração do contrato, à gestão do futuro contrato, ou aos resultados pretendidos com a contratação. No âmbito da Administração Pública federal direta, autárquica e fundacional, a equipe de planejamento da contratação é responsável pela elaboração do mapa de riscos, na etapa de planejamento. Durante a seleção do fornecedor, o mapa será atualizado por representante da área de contratações, com o apoio de representantes das áreas técnica e requisitante. Na fase de gestão contratual, a atividade será realizada pela equipe de fiscalização do contrato. Ou seja, a gestão dos riscos da contratação acontece ao longo do metaprocesso de contratação. O gerenciamento de riscos é previsto no art. 26 da Instrução Normativa MPDG nº 05/2017 e a própria IN 05/2017 propõe um modelo de Mapa de Riscos, constante do Anexo IV. EEAR – DIVISÃO DE ENSINO DE PÓS-FORMAÇÃO (DEPF) 30 / 79 CAA – GESTÃO PATRIMONIAL NO COMAER EEAR c) TERMO DE REFERÊNCIA (TR) Definido pela Lei de Licitação no inc XXIII do art. 6º, como documento necessário para a contratação de bens e serviços, que deve conter os seguintes parâmetros e elementos descritivos: a) definição do objeto, incluídos sua natureza, os quantitativos, o prazo do contrato e, se for o caso, a possibilidade de sua prorrogação; b) fundamentação da contratação, que consiste na referência aos estudos técnicos preliminares correspondentes ou, quando não for possível divulgar esses estudos, no extrato das partes que não contiverem informações sigilosas; c) descrição da solução como um todo, considerado todo o ciclo de vida do objeto; d) requisitos da contratação; e) modelo de execução do objeto, que consiste na definição de como o contrato deverá produzir os resultados pretendidos desde o seu início até o seu encerramento; f) modelo de gestão do contrato, que descreve como a execução do objeto será acompanhada e fiscalizada pelo órgão ou entidade; g) critérios de medição e de pagamento; h) forma e critérios de seleção do fornecedor; i) estimativas do valor da contratação, acompanhadas dos preços unitários referenciais, das memórias de cálculo e dos documentos que lhe dão suporte, com os parâmetros utilizados para a obtenção dos preços e para os respectivos cálculos, que devem constar de documento separado e classificado; j) adequação orçamentária; O Termo de Referência deve ser elaborado a partir das informações contidas no Estudo Preliminar e no Gerenciamento de Riscos, utilizando os modelos disponibilizados pela Advocacia-Geral da União (AGU), pelo link: EEAR – DIVISÃO DE ENSINO DE PÓS-FORMAÇÃO (DEPF) EEAR CAA – GESTÃO PATRIMONIAL NO COMAER 31 /79 Modelos da Lei nº 14.133/21 para pregão e concorrência https://www.gov.br/agu/pt-br/composicao/cgu/cgu/modelos/ licitacoesecontratos/14133/modelos-da-lei-no-14-133-21- Veja isto! para-pregao-e-concorrencia Assim, cabe à Equipe de Planejamento selecionar o modelo de TR de acordo com o tipo do objeto a ser licitado (compras ou serviços), e, seguindo as instruções contidas nos arquivos disponibilizados, confeccionar o TR, considerando as informações já coletadas no ETP e Mapa de Riscos. Em linhas gerais, Termo de Referência é o documento que deve descrever os bens ou serviços a serem contratados, as condições de aceitação do objeto e também como se dará gestão contratual. Visto que este documento é prévio à execução do certame licitatório, ele servirá de base para a elaboração futura do edital. As organizações da Administração Pública federal direta, autárquica e fundacional do Poder Executivo devem confeccionar o TR no Sistema TR Digital, no Portal de Compras do Governo Federal. Cabe esclarecer que, enquanto o ETP se caracteriza por ser um instrumento de planejamento preliminar, por meio do qual são avaliadas determinadas soluções para atendimento de uma necessidade da Administração, concluindo se a contratação será ou não viável, o TR é o planejamento definitivo, para especificação e detalhamento da solução escolhida. Portanto, apesar de haver pontos em comum entre esses dois instrumentos, eles não se confundem. Os requisitos e estimativas da solução estudada e escolhida no ETP são refinados (ou retificados e complementados) no TR, que conterá informações mais exatas e atualizadas. Além disso, o TR esclarece como o futuro contrato será executado e fiscalizado, apresenta os critérios para recebimento provisório e definitivo do bem ou serviço prestado, define a forma e critérios para seleção do fornecedor, e indica os recursos orçamentários para a contratação. Ou seja, no TR pode haver o refinamento de itens do ETP e há a elaboração de novos elementos que não constam do ETP. EEAR – DIVISÃO DE ENSINO DE PÓS-FORMAÇÃO (DEPF) 32 / 79 CAA – GESTÃO PATRIMONIAL NO COMAER EEAR Além disso, devido ao parcelamento do objeto, uma solução prevista em um ETP pode resultar em várias contratações de objetos distintos, que, em conjunto, formarão a solução indicada. Assim, um ETP pode resultar na elaboração de mais de um termo de referência. A competência para elaboração do termo de referência é da equipe de planejamento da contratação, composta pela área requisitante, pela área administrativa e por áreas específicas como a de TI, no caso de contratações de objetos dessa natureza. Apesar de a área administrativa poder contribuir com conhecimentos específicos sobre a forma de condução do certame, é a área requisitante e a área especializada que detêm o conhecimento mais aprofundado acerca do objeto e das especificações necessárias para atendimento da demanda da Administração. OBSERVAÇÃO: Nesse contexto é válido trazer a observação contida no modelo de Termo de Referência de obras e serviços de engenharia, que diferencia os conceitos de Termo de Referência e Projeto Básico. Será utilizada a locução “termo de referência” para designar o documento jurídico-administrativo previsto no art. 6º, XXIII, da Lei nº 14.133/2021, que contém as informações necessárias, fornecidas pela Administração Pública, para delimitar o objeto contratado, sem, entretanto, trazer especificações técnicas cuja preparação é privativa de determinados profissionais, como engenheiros, arquitetos e técnicos industriais. Quanto a esses aspectos, o documento a ser apresentado, se for o caso, será um projeto básico, previsto no art. 6º, XXV, da Lei, que, quando necessário, deverá ser anexo a este Termo de Referência. EEAR – DIVISÃO DE ENSINO DE PÓS-FORMAÇÃO (DEPF) EEAR CAA – GESTÃO PATRIMONIAL NO COMAER 33 /79 2.8 PONTOS RELEVANTES a) FAVORECIMENTO DE PEQUENAS E MICROEMPRESAS Baseada no art. 146 da Constituição Federal, a Lei Complementar foi criada com a finalidade de regulamentar o tratamento diferenciado e favorecido às Microempresas e Empresas de Pequeno Porte (ME/EPP) relativo a matérias fiscais e de cunho licitatório. Assim, segundo o Art. 48, inciso I, da LC 123/2006, a Administração Pública: I – Deverá realizar Processo Licitatório destinado exclusivamente à participação de microempresas e empresas de pequeno porte nos itens de contratação cujo valor seja de até R$ 80.000,00 (oitenta mil reais). II – Poderá, em relação aos Processos Licitatórios destinados obras e serviços, exigir dos licitantes a subcontratação de Microempresa ou empresa de pequeno porte. III – Deverá estabelecer, em certames para aquisição de bens de natureza divisível, cota de até 25% do objeto para a contratação de microempresas e empresas de pequeno porte. b) PROJETO EXECUTIVO Conforme prevê o Inc. XXVI do art. 6º da Lei 14.133/21, é o conjunto de elementos necessários e suficientes à execução completa da obra, daí o nome “executivo”, com o detalhamento das soluções previstas no projeto básico, a identificação de serviços, de materiais e de equipamentos a serem incorporados à obra, bem como suas especificações técnicas, de acordo com as normas técnicas pertinentes. c) SISTEMA DE REGISTRO DE PREÇOS (SRP) Previsto no Decreto nº 11.462/2023, em linhas gerais, é a reunião de procedimentos administrativos que visam o registro formal de preços que se referem tanto ao fornecimento de bens, quanto à execução de serviços, firmada por meio de um documento denominado “Ata de Registro de Preços”. Assim, o Sistema de Registro de Preços implementa uma nova metodologia às contratações públicas, diferenciando-se das contratações convencionais, visto que proporciona à Administração a possibilidade de, nas condições editalícias preestabelecidas, realizar a mesma contratação repetidas vezes durante um período e preço preestabelecidos, enquanto na convencional tal feito é único. EEAR – DIVISÃO DE ENSINO DE PÓS-FORMAÇÃO (DEPF) 34 / 79 CAA – GESTÃO PATRIMONIAL NO COMAER EEAR Ressalta-se que, no SRP, o período para aquisições é delimitado à estimativa de quantidade dos itens licitados e pela validade da ata de registro de preços, com vigência de um ano, podendo ser prorrogada por igual período, desde que comprovada a vantajosidade e que seja de comum acordo entre a Administração e o fornecedor. Além disso, insta salientar que a ata de registro de preço não se confunde com um contrato administrativo, pois aquela, baseada no Decreto nº 11.462/2023, refere-se ao compromisso de manutenção da proposta de preço durante certo período, mediante às condições preestabelecidas em edital. No entanto, o contrato é regido pela Lei 14.133/21 e, resumidamente, tem como escopo a relação entre as obrigações da Contratante e da Contratada para execução de algum objeto. ➔ Procure no conteúdo estudado as palavras-chave que melhor representam o que foi estudado até aqui. ➔ Faça uma lista dessas palavras-chave seguida de um breve comentário. Vamos fazer algumas anotações! ➔ A partir da leitura delas, tente reconstruir o que foi visto. Parabéns por ter avançado até aqui! Está na hora de fazer uma pausa. Lembre-se de que o descanso e a reflexão fazem parte do estudo. Agora, que tal uma pausa? A partir de suas anotações, reconstrua, com suas palavras, todo o estudo em um ou dois parágrafos, ou, se preferir, elabore um mapa mental ou um infográfico sobre o texto. Está na hora de resumir! EEAR – DIVISÃO DE ENSINO DE PÓS-FORMAÇÃO (DEPF) EEAR CAA – GESTÃO PATRIMONIAL NO COMAER 35 /79 Exercícios para Aprendizagem do Capítulo Bem, agora que você já cumpriu uma etapa da missão, que tal avaliar seu grau de assimilação em relação ao conteúdo que foi visto neste capítulo? Não se preocupe caso não saiba responder prontamente. A proposta é que você consulte as suas anotações ou produza um debate com algum companheiro. Você pode usar o fórum entre pares no EEAR Virtual. O importante é que você resolva os exercícios abaixo. 1. Conforme Instrução Normativa MPDG 05/2017, quais são os documentos que fazem parte do planejamento da contratação: a) Ata de Registro de Preços e Edital b) Edital e Contrato c) Estudos Técnicos Preliminares, Mapa de Risco e Termo de Referência d) Estudo Técnico Preliminar, Projeto Básico e Edital 2. É a modalidade caracterizada pela obrigatoriedade da adoção em casos de aquisição de bens e serviços comuns, cujos critérios de julgamento para esta modalidade podem ser: menor preço ou maior desconto: a) Pregão b) Concurso c) Concorrência d) Nenhuma das anteriores __________________________________________________________________________________ GABARITO 2 -A 1 -C EEAR – DIVISÃO DE ENSINO DE PÓS-FORMAÇÃO (DEPF) 36 / 79 CAA – GESTÃO PATRIMONIAL NO COMAER EEAR 3 EXECUÇÃO ORÇAMENTÁRIA 3.1 PROCESSO DE EXECUÇÃO ORÇAMENTÁRIA Pode-se afirmar que se inicia após a publicação da LOA e do cadastro da Nota de Dotação realizado pela Secretaria de Orçamento Federal (SOF), no SIAFI, tornando possível a criação do Crédito Orçamentário. É a partir desse momento que se inicia a execução orçamentária. Desse jeito, sintetiza-se que a execução orçamentária é realizar as despesas públicas preestabelecidas na Lei Orçamentária Anual. 3.2. ESTÁGIOS DA DESPESA PÚBLICA Segundo a Lei nº 4.320/64, existem 3 estágios necessários para a realização da despesa pública: empenho, liquidação e pagamento. Provavelmente você já ouviu falar em Empenho. Descubra em sua OM o setor responsável pelos Empenhos. Agora é a oportunidade de compreender melhor esse assunto que é essencial na execução orçamentária. a) PRIMEIRO ESTÁGIO: EMPENHO Empenho é o primeiro estágio da despesa pública e pode ser definido, conforme art. 58 da Lei nº 4.320/64, como o ato administrativo emitido de autoridade competente que vincula à Administração a obrigação de pagamento. A materialização deste ato dá-se pela emissão da Nota de Empenho (NE), sendo o documento que registra contabilmente o empenho da despesa no SIAFI. Nele constam, basicamente, as seguintes informações: nome do beneficiário, especificação dos itens, quantitativo da despesa, quantitativo dos itens e a dotação orçamentária que se está utilizando. Ressalta-se que o empenho não poderá ultrapassar o limite de crédito recebido, nem a despesa ser realizada sem o prévio empenho. MODALIDADES DE EMPENHO Para tal, os empenhos, em concordância com a finalidade e natureza, podem ser classificados em ordinário, estimativo ou global. ➔ Ordinário: ressalta-se que, por consequência, não possibilita a execução ou entrega parcelada do objeto do empenho; ➔ Estimativo: é muito empregado na destinação de atendimento às despesas cujo valor não se possa determinar previamente. Caso de contratos por demanda, como o de energia elétrica; e EEAR – DIVISÃO DE ENSINO DE PÓS-FORMAÇÃO (DEPF) EEAR CAA – GESTÃO PATRIMONIAL NO COMAER 37 /79 ➔ Global: destinado a atender às despesas com montante previamente conhecido (tais como as contratuais), mas de pagamento parcelado (§ 3.º do art. 60 da Lei nº 4.320/64). Tal proporciona a possibilidade de entrega ou execução do objeto do empenho de maneira parcelada. b) SEGUNDO ESTÁGIO: LIQUIDAÇÃO Basicamente, é o ato administrativo que comprova que o beneficiado do empenho cumpriu todas as obrigações contratuais. A finalidade é reconhecer a origem (nota de empenho), o objeto, a exata importância e a quem se deve. É consubstanciado via documento contábil no SIAFI. Assim, pode-se afirmar que a liquidação envolve ações de verificação do serviço prestado ou do bem entregue, confrontando-os com as informações do empenho emitido. Os Agentes Públicos especialmente designados em comissão por autoridade competente atestarão, mediante Termo de Recebimento, a correta entrega dos itens ou execução dos bens/serviços constantes na Nota de Empenho para que, somente após isso, outro Agente da Administração realize o correto procedimento contábil de liquidação no SIAFI. c) TERCEIRO ESTÁGIO: PAGAMENTO Esta é o último estágio da execução da despesa, que é quando há o efetivo repasse do numerário (dinheiro) ao beneficiário do empenho, sendo realizado por meio de Crédito em conta bancária do credor, após assinatura de Ordem de Pagamento no SIAFI. É nessa fase que ocorre a retenção tributária na fonte pagadora, quando são calculados os impostos devidos de acordo com tipo de material e serviço e feita a dedução do valor bruto da respectiva nota fiscal. EEAR – DIVISÃO DE ENSINO DE PÓS-FORMAÇÃO (DEPF) 38 / 79 CAA – GESTÃO PATRIMONIAL NO COMAER EEAR ➔ Procure, no conteúdo estudado, as palavras-chave que melhor representam o que foi estudado até aqui. ➔ Faça uma lista dessas palavras-chave seguida de um breve comentário. Vamos fazer algumas anotações! ➔ A partir da leitura delas, tente reconstruir o que foi visto. Parabéns por ter avançado até aqui! Está na hora de fazer uma pausa. Lembre-se de que o descanso e a reflexão fazem parte do estudo. Agora, que tal uma pausa? A partir de suas anotações, reconstrua, com suas palavras, todo o estudo em um ou dois parágrafos, ou, se preferir, elabore um mapa mental ou um infográfico sobre o texto. Está na hora de resumir! EEAR – DIVISÃO DE ENSINO DE PÓS-FORMAÇÃO (DEPF) EEAR CAA – GESTÃO PATRIMONIAL NO COMAER 39 /79 Exercícios para Aprendizagem do Capítulo Bem, agora que você já cumpriu uma etapa da missão, que tal avaliar seu grau de assimilação em relação ao conteúdo em que foi visto neste capítulo? Não se preocupe caso não saiba responder prontamente. A proposta é que você consulte as suas anotações ou produza um debate com algum companheiro. Você pode usar o fórum entre pares no EEAR Virtual. O importante é que você resolva os exercícios abaixo. 1. É o processo que se inicia após a publicação da LOA e do cadastro da Nota de Dotação realizado pela SOF, no SIAFI, que se torna possível a criação do Crédito. Tal procedimento é denominado: a) Execução Orçamentária b) Execução Financeira c) Execução Patrimonial d) Execução da Despesa 2. Segundo a Lei nº 4.320/64, existem os seguintes três estágios necessários para a realização da despesa pública: a) Empenho, liquidação e pagamento. b) Empenho, apropriação e pagamento. c) Empenho, cadastro da Nota fiscal e pagamento. d) Nenhuma das anteriores. _____________________________________________________________________________ GABARITO 1–A 2– A EEAR – DIVISÃO DE ENSINO DE PÓS-FORMAÇÃO (DEPF) 40 / 79 CAA – GESTÃO PATRIMONIAL NO COMAER EEAR 4 IRREGULARIDADES ADMINISTRATIVAS O acompanhamento da execução contratual tem se mostrado uma tarefa de bastante relevância para a União atingir os objetivos estabelecidos no seu Orçamento, além de garantir o pleno cumprimento das cláusulas editalícias. No COMAER, a fiscalização e o recebimento de bens e serviços, bem como a aplicação de sanções administrativas são normatizadas pelo Manual de Contratações Públicas do COMAER, ICA 12-23/2023, Portaria GABAER nº 623/GC4, de 20 de novembro de 2023, e a fiscalização dos contratos de obras e serviços de engenharia são normatizados pela ICA 85-16/2017. 4.1 CONCEITOS GERAIS Fiscalização - denominação genérica relativa à atividade exercida por Agente da Administração, especialmente designado pela autoridade competente, para o exercício do encargo de Fiscal de contrato, ou por Comissão especificamente designada, com o objetivo de verificar o cumprimento de disposições contratuais e de ordens complementares emanadas da Administração, sobre a execução de instrumentos pactuados, em todos os seus aspectos, visando, também, identificar eventuais desvios ou desconformidades na execução e adotar, proativamente, ações no sentido de corrigi-los ou, quando fora da sua esfera de competência, propô-las, fundamentadamente, à autoridade superior para tomada de decisão. Processo Administrativo de Apuração de Irregularidade (PAAI) – procedimento administrativo interno formal composto do registro de todos os atos e da apuração dos fatos administrativos, necessário ao correto esclarecimento e julgamento pela autoridade competente, permitindo-lhe instruir o devido processo legal, que culmine na aplicação ou não das sanções administrativas previstas em lei. Unidade Gestora (UG) – Denominação genérica de Organização Militar (OM), ou fração de OM, encarregada, por atos legais, da gerência de patrimônio e de recursos creditícios ou financeiros a ela especificamente atribuída, no todo ou em parte. Assessoria de Risco Contratual (ARC) – Assessoria vinculada diretamente ao Dirigente Máximo/Ordenador de Despesas da OM com a finalidade de acompanhar o fluxo financeiro-orçamentário na evolução do adimplemento dos objetos contratados, com vistas a auxiliar a identificação e o acompanhamento das Notas de Empenho e/ou de Restos a Pagar, passíveis de anulação, registrados nas contas contábeis “empenhos a liquidar” e “empenhos inscritos em restos a pagar”, bem como o de instruir o Processo Administrativo de Apuração de Irregularidade (PAAI) das empresas inadimplentes, nos moldes que preconiza a legislação específica de suporte EEAR – DIVISÃO DE ENSINO DE PÓS-FORMAÇÃO (DEPF) EEAR CAA – GESTÃO PATRIMONIAL NO COMAER 41 /79 Ampla defesa – Direito de defesa irrestrita e de contra-argumentação diante de atos imputados à pessoa física ou jurídica, formalmente elaborada por escrito e com identificação do autor competente para se manifestar em nome do arrolado. Contraditório – É a possibilidade de livre manifestação das partes a cada fato novo surgido no processo, de forma que, da tese desenvolvida pelo autor e da antítese trazida pela contraparte, possa se deduzir a síntese. Notificação – Ato por meio do qual dá-se conhecimento formal e legal do texto de um documento registrado a determinada pessoa. OBS.: No atual cenário, a ICA 12-23 normatiza a dosimetria de sanções para a Lei nº 8.666/1993, enquanto a Portaria nº 623/GC4, de 20 de novembro de 2023, alterada pela Portaria GABAER nº 898/GC4, de 24 de janeiro de 2025, para a Lei nº 14.133/2021. Apesar de a lei anterior ter sido revogada, os contratos formalizados com base nela e que ainda permanecem vigentes são, por essa lei, regidos e, consequentemente, a ICA 12-23 ainda tem aplicação no âmbito do COMAER. EEAR – DIVISÃO DE ENSINO DE PÓS-FORMAÇÃO (DEPF) 42 / 79 CAA – GESTÃO PATRIMONIAL NO COMAER EEAR ➔ Procure, no conteúdo estudado, as palavras-chave que melhor representam o que foi estudado até aqui. ➔ Faça uma lista dessas palavras-chave seguida de um breve comentário. Vamos fazer algumas anotações! ➔ A partir da leitura delas, tente reconstruir o que foi visto. 4.2 PROCESSO ADMINISTRATIVO DE APURAÇÃO DE IRREGULARIDADES O Processo Administrativo de Apuração de Irregularidades (PAAI) apenas tem seu início/sua instauração/sua abertura datado(a) após a autorização do Ordenador de Despesas (OD) da UG responsável pelo recurso orçamentário, fato a ser realizado imediatamente após a confecção de um ofício de Exposição de fatos por uma Comissão de Fiscalização designada. O referido ofício deve relatar um breve resumo dos fatos e consultar o OD quanto à decisão de instauração de Processo Administrativo de Apuração de Irregularidade. Além disso, ressalta-se que um PAAI apenas será instaurado caso a empresa contratada incorra em descumprimento de alguma cláusula contratual, decorrente de processo licitatório. Todo agente da administração, ao tomar conhecimento de descumprimento ou de inadimplemento de obrigação contratual deverá comunicar formalmente o fato à fiscalização do contrato, se houver, que por sua vez, o comunicará ao Ordenador de Despesas da UG sancionadora. Assim que for identificada qualquer irregularidade no cumprimento das obrigações pela licitante ou pela contratada, a Administração deverá expedir notificação, estabelecendo prazo para que esta adote as providências solicitadas ou apresente suas justificativas formais. A notificação poderá ser por meio de: a) mensagem eletrônica, desde que haja confirmação de seu recebimento; b) serviço postal, com Aviso de Recebimento (AR); c) entrega ao preposto com apresentação de recibo; d) entrega ao preposto com a presença de duas testemunhas, caso haja recusa em recebê- las; ou, e) na impossibilidade de confirmar recebimento, publicação da notificação em Diário Oficial da União. EEAR – DIVISÃO DE ENSINO DE PÓS-FORMAÇÃO (DEPF) EEAR CAA – GESTÃO PATRIMONIAL NO COMAER 43 /79 A partir desse momento, deverá ser aguardado um período de 5 (cinco) dias úteis ou 15 (quinze) dias úteis, conforme enquadramento legal que será detalhado adiante, para apresentação da defesa pela empresa. Caso não haja defesa, ou a esta seja julgada improcedente pela Administração, a Comissão de Fiscalização deverá realizar um documento, a ser encaminhado ao OD, apresentando a Exposição dos Fatos referente à ocorrência da irregularidade, anexando todos os documentos que atestem o inadimplemento, tais como termo de referência, nota de empenho, notas fiscais e as notificações enviadas. Se a Administração julgar plausível, será determinada pelo Ordenador de Despesas a abertura do Processo Administrativo de Apuração de Irregularidade (PAAI). Quando aberto o PAAI, o Ordenador de Despesas da UG responsável pelo recurso orçamentário solicitará ao Chefe da ARC a intermediação da apuração e instrução processual. Após o Ordenador de Despesas autorizar motivadamente a continuidade do processo, a Contratada será notificada acerca da instauração do PAAI. Nessa notificação, será relatado um breve resumo dos fatos, as irregularidades observadas, amparadas pela referência contratual e referência legal, sendo lhe dado o prazo de: - 5 (cinco) dias úteis para apresentação da defesa, nos processos instaurados com base na Lei nº 8.666/1993 ou na Lei nº 10.520/2002; e - 15 (quinze) dias úteis para apresentação da defesa, nos processos instaurados com base na Lei nº 14.133/2021. IMPORTANTE: As Leis nº 8.666/93 e nº 10.520/2002 foram revogadas em 30 de dezembro de 2023 pela Lei nº 14.133/2021. Embora não haja atualmente mais a possibilidade de realização de procedimento licitatório com base nas Leis nº 8.666/93 e nº 10.520/2002, HÁ AINDA a possibilidade de instauração de PAAI’s amparados por elas, tendo em vista que a formalização dos PAAI’s está estritamente ligada à legislação base do processo licitatório por meio do qual se deu o descumprimento de cláusula contratual. Ex: se uma empresa descumpriu determinada condição contratual de um pregão já homologado com base na Lei nº 10.520/2002, o PAAI a ser instruído terá enquadramento na Lei nº 10.520/2002, por mais que essa lei não seja mais utilizada para fins de confecção de um processo licitatório. EEAR – DIVISÃO DE ENSINO DE PÓS-FORMAÇÃO (DEPF) 44 / 79 CAA – GESTÃO PATRIMONIAL NO COMAER EEAR O Ordenador de Despesas deverá requisitar da ARC a elaboração de um Parecer Administrativo, após a Contratada ter apresentado, ou não, sua defesa. Em ato contínuo, o OD analisará os autos do processo e decidirá, por meio de documento formal, com despacho fundamentado, pela aplicação da sanção administrativa ou pelo arquivamento do processo. A dosimetria para a aplicação das sanções está preestabelecida tanto na ICA 12-23/2023 quanto na Portaria nº 623/GC4, de 20 de novembro de 2023, a depender da legislação utilizada, conforme item 4.4.2 do Manual de Contratações Públicas do COMAER: ➢ ICA 12-23/2023 → Lei nº 8.666/1993 e Lei nº 10.520/2002; e ➢ Portaria nº 623/GC4, de 20 de novembro de 2023 → Lei nº 14.133/2021. As legislações devem ser públicas, bem como o lançamento da sanção nos sistemas cadastrais. Para aplicação das sanções, deverão ser considerados a gravidade da falha, reincidência, o dano causado à Administração e o caráter educativo da pena, obedecendo aos princípios da Legalidade, Impessoalidade, Publicidade, Razoabilidade e Proporcionalidade. São sanções administrativas, conforme disposto no art. 87 da Lei nº 8.666/1993 e nos art. 7º e 9º da Lei nº 10.520/2002: a) Advertência; b) Multa; c) Suspensão temporária de participação em licitação e impedimento de contratar com a Administração, por prazo não superior a 2 (dois) anos (art 87 da Lei n° 8.666/93); ou Impedimento de Licitar e Contratar com a União, os Estados, Distrito Federal ou Municípios ( a depender da subordinação administrativa do órgão sancionador), pelo prazo de até 05 (cinco) anos (art.7° da Lei n° 10.520/2022); e d) Declaração de inidoneidade para licitar ou contratar com a Administração Pública. São sanções administrativas, conforme disposto no art. 156 da Lei nº 14.133/2021: a) Advertência; b) Multa; c) Impedimento de licitar e contratar com a Administração por prazo não superior a 3 (três) anos; e d) Declaração de inidoneidade para licitar ou contratar com a Administração Pública. EEAR – DIVISÃO DE ENSINO DE PÓS-FORMAÇÃO (DEPF) EEAR CAA – GESTÃO PATRIMONIAL NO COMAER 45 /79 A decisão do Ordenador de Despesas será comunicada à empresa por meio de documento formal. Caso a Contratada queira, poderá interpor recurso por escrito. O recurso será analisado pela ARC, que emitirá outro Parecer Administrativo para assessoramento do Ordenador de Despesas. Caso o OD acolha as razões do Contratado, a sanção administrativa será revogada, o PAAI arquivado e o licitante informado. Caso o OD não acolha as razões contidas no recurso, decidirá por escrito, com argumentação fundamentada, a análise dos fatos e encaminhará os autos do PAAI para apreciação do recurso pela Autoridade Superior. EEAR – DIVISÃO DE ENSINO DE PÓS-FORMAÇÃO (DEPF) 46 / 79 CAA – GESTÃO PATRIMONIAL NO COMAER EEAR Considera-se Autoridade Superior, de acordo com os itens 4.4.31 e 4.4.32 do Manual de Contratações Públicas do COMAER, o superior imediato da autoridade que decidiu inicialmente pela imposição da sanção. A Autoridade Superior decidirá motivadamente, em 5 (cinco) dias úteis, sobre o recurso elaborado e informará o Ordenador de Despesas, caso o PAAI tramite pela Lei nº 8.666/1993, ou em 20 (vinte) dias úteis, caso o PAAI tramite pela Lei nº 14.133/2021. Posteriormente, por meio de Ofício, o OD dará ciência ao fornecedor da decisão. O PAAI se encerra com a publicação da decisão final da sanção no Diário Oficial da União (DOU), não cabendo mais recurso na esfera administrativa. Todas as sanções aplicadas devem ser registradas no Sistema de Cadastro Unificado de Fornecedores (SICAF). Não é necessária a publicação das sanções de Advertência ou Multa em DOU, apenas seu registro no SICAF, nos termos do item 4.4.42 do Manual de Contratações Públicas do COMAER. EEAR – DIVISÃO DE ENSINO DE PÓS-FORMAÇÃO (DEPF) EEAR CAA – GESTÃO PATRIMONIAL NO COMAER 47 /79 ➔ Procure, no conteúdo estudado, as palavras-chave que melhor representam o que foi estudado até aqui. ➔ Faça uma lista dessas palavras-chave seguida de um breve comentário. Vamos fazer algumas anotações! ➔ A partir da leitura delas, tente reconstruir o que foi visto. Parabéns por ter avançado até aqui! Está na hora de fazer uma pausa. Lembre-se de que o descanso e a reflexão fazem parte do estudo. Agora, que tal uma pausa? A partir de suas anotações, reconstrua, com suas palavras, todo o estudo em um ou dois parágrafos, ou, se preferir, elabore um mapa mental ou um infográfico sobre o texto. Está na hora de resumir! EEAR – DIVISÃO DE ENSINO DE PÓS-FORMAÇÃO (DEPF) 48 / 79 CAA – GESTÃO PATRIMONIAL NO COMAER EEAR Exercícios para Aprendizagem do Capítulo Bem, agora que você já cumpriu uma etapa da missão, que tal avaliar seu grau de assimilação em relação ao conteúdo visto neste capítulo? Não se preocupe caso não saiba responder prontamente. A proposta é que você consulte as suas anotações ou produza um debate com algum companheiro. Você pode usar o fórum entre pares no EEAR Virtual. O importante é que você resolva os exercícios abaixo. 1. Quem é o Agente da Administração responsável pela autorização de abertura da PAAI? a) Ordenador de Despesas. b) Comissão de Fiscalização. c) Comissão de Recebimento. d) Assessor de Risco Contratual. 2. São formas de entrega da notificação a fornecedores, exceto: a) Entrega ao preposto com apresentação de recibo. b) Mensagem eletrônica, desde que haja confirmação de seu recebimento. c) Serviço postal, com Aviso de Recebimento (AR). d) Publicação da notificação no SICAF. 3. São sanções administrativas no caso de PAAI para quaisquer legislações de Contratações Públicas (Lei nº 8.666/1993, Lei nº 10.520/2002 e Lei nº 14.133/2021), exceto: a) Multa. b) Suspensão de empenhar. c) Advertência. d) Declaração de Inidoneidade. 4. Amparada pelos princípios da ampla defesa e/ou contraditório, uma Contratada pode elaborar recurso por escrito sobre decisão emitida Ordenador de Despesas, decorrente de eventual sanção administrativa a ser aplicada. Nesse sentido, havendo recurso da contratada a ser sancionada, a ARC fará EEAR – DIVISÃO DE ENSINO DE PÓS-FORMAÇÃO (DEPF) EEAR CAA – GESTÃO PATRIMONIAL NO COMAER 49 /79 novo Parecer Administrativo para assessorar o Ordenador de Despesas. Considerando o âmbito FAB, caso o OD não acolha as razões contidas nesse último recurso da Contratada, ele decidirá por escrito (com argumentação fundamentada) a análise dos fatos e encaminhará os autos do PAAI para apreciação do recurso pelo(a): a) Assessoria de Controle Interno. b) Gestor de Licitações. c) Comandante da Aeronáutica. d) Autoridade Superior. 5. No caso de irregularidade realizada por algum fornecedor contratado, o processo de apuração dos fatos se dá, entre outras ações, por meio das discriminadas abaixo. Enumere-as na ordem correta: ( ) I – Emissão de Parecer Administrativo pela ARC. ( ) II – Apresentação da Defesa pela Contratada. ( ) III – Notificação à Contratada. ( ) IV – Decisão da aplicação da sanção ou arquivamento do processo. a) III, II, I, IV. b) IV, I, III, II. c) III, I, IV, II. d) I, II, III, IV. 6. As sanções administrativas devem ser publicadas no DOU e registradas no SICAF, exceto: a) Advertência e Multa, que podem apenas ser registradas no SICAF. b) Advertência e Multa, que podem apenas ser publicadas no DOU. c) Impedimento de Contratar, que pode apenas ser registrado no SICAF. d) Declaração de Inidoneidade, que pode apenas ser publicado no DOU. GABARITO 2–D 4–D 1–A 3–B 5–A 6–A EEAR – DIVISÃO DE ENSINO DE PÓS-FORMAÇÃO (DEPF) EEAR CAA – GESTÃO PATRIMONIAL NO COMAER 51 /79 5 BENS PATRIMONIAIS NA FORÇA AÉREA BRASILEIRA Parabéns pelo seu avanço! Estamos fazendo grandes progressos. Vimos um pouco sobre o orçamento e suas características. Seguiremos agora falando sobre o Patrimônio Público, sendo uma parte fundamental para o funcionamento de toda Organização Militar. Bons estudos! 5.1 CONCEITOS INICIAIS PATRIMÔNIO PÚBLICO: é o conjunto de direitos e bens, tangíveis ou intangíveis, onerados ou não, adquiridos, formados, produzidos, recebidos, mantidos ou utilizados pelas entidades do setor público que seja portador ou represente um fluxo de benefícios, presente ou futuro, inerente à prestação de serviços públicos ou à exploração econômica por entidades do setor público e suas obrigações. (Manual B – RADA-e). O patrimônio público compõe-se dos seguintes elementos: Ativos, Passivos e Patrimônio Líquido (saldo patrimonial ou situação líquida patrimonial): Figura 1 – Elementos do Patrimônio PASSIVO Obrigações ATIVO Bens; Direitos PATRIMÔNIO LÍQUIDO Vamos conhecer cada um desses elementos, conforme conceitos contidos no Manual de Contabilidade Aplicado ao Setor Público 10.ª Edição (MCASP): ATIVO: é um recurso (item com potencial de serviços ou com a capacidade de gerar benefícios econômicos) controlado no presente pela entidade como resultado de evento passado. - Potencial de Serviços: capacidade de prestar serviços que contribuam para alcançar os objetivos da entidade, sem, necessariamente, gerar entrada líquida de caixa. - Benefícios Econômicos: entradas de caixa ou as reduções das saídas de caixa. EEAR – DIVISÃO DE ENSINO DE PÓS-FORMAÇÃO (DEPF) 52 / 79 CAA – GESTÃO PATRIMONIAL NO COMAER EEAR CONTROLADO NO PRESENTE: capacidade da entidade em utilizar o recurso (ou controlar ter – Controlado no Presente: capacidade da entidade em utilizar o recurso (ou controlar terceiros na sua utilização) de modo que haja a geração do potencial ou dos benefícios econômicos. - Evento Passado: A definição de ativo exige que o recurso controlado pela entidade no presente tenha surgido de um evento passado, por meio de transação com ou sem contraprestação. Exemplos: compra de ativos por meio de uma transação comercial (com contraprestação) ou emissão de licenças para bandas de frequência de transmissões de telecomunicações (sem contraprestação). PASSIVO: é uma obrigação presente, derivada de evento passado, cuja extinção deva resultar na saída de recursos da entidade. - Obrigação Presente: é aquela que ocorre por força de lei (obrigação legal ou legalmente vinculada) ou não (obrigação não legalmente vinculada), a qual não possa ser evitada pela entidade. - Evento Passado: Para satisfazer a definição de passivo, é necessário que a obrigação presente surja como resultado de um evento passado e necessite da saída de recursos da entidade para ser extinta. - Saída de recursos da entidade: Um passivo deve envolver uma saída de recursos da entidade para ser extinto. A obrigação que pode ser extinta sem a saída de recursos da entidade não é um passivo. Por exemplo, perdão de dívidas. PATRIMÔNIO LÍQUIDO/(SITUAÇÃO PATRIMONIAL LÍQUIDA): é a diferença entre os ativos e os passivos após a inclusão de outros recursos e a dedução de outras obrigações, reconhecida no Balanço Patrimonial como patrimônio líquido. A situação patrimonial líquida pode ser um montante positivo ou negativo. Conhecer o Patrimônio Líquido é muito importante, mas como ocorrem as variações patrimoniais? E sua avaliação? Vamos seguir juntos nesse estudo! EEAR – DIVISÃO DE ENSINO DE PÓS-FORMAÇÃO (DEPF) EEAR CAA – GESTÃO PATRIMONIAL NO COMAER 53 /79 5.2 VARIAÇÕES E AVALIAÇÃO PATRIMONIAL a) VARIAÇÕES PATRIMONIAIS O MCASP define que as variações patrimoniais aumentativas (VPA) e diminutivas (VPD) são transações que promovem alterações nos elementos patrimoniais da entidade do setor público que afetam o resultado. - Variação Patrimonial Aumentativa Corresponde a aumentos na situação patrimonial líquida da entidade não oriundos de contribuições dos proprietários. O reconhecimento do VPA pode ocorrer em três momentos: antes, depois ou no momento da arrecadação da receita orçamentária. Conforme o MCASP, receitas orçamentárias são disponibilidades de recursos financeiros que ingressam durante o exercício e que aumentam o saldo financeiro da instituição. Instrumento por meio do qual se viabiliza a execução das políticas públicas, cuja finalidade precípua é atender às necessidades públicas e demandas da sociedade. - Variação Patrimonial Diminutiva Corresponde a diminuições na situação patrimonial líquida da entidade não oriundas de distribuições aos proprietários. A VPD pode ocorrer em três momentos: antes, depois ou no momento da liquidação da despesa orçamentária. Segundo o MCASP, despesas orçamentárias é o conjunto de dispêndios realizados pelos entes públicos para o funcionamento e manutenção dos serviços públicos prestados à sociedade. b) AVALIAÇÃO PATRIMONIAL De acordo o MCASP, Avaliação Patrimonial é a atribuição de valor monetário a itens do ativo e do passivo, decorrentes de julgamento fundamentado em consenso entre as partes e que traduza, com razoabilidade, a evidenciação dos atos e dos fatos administrativos. A seguir, seguem algumas definições extraídas do MCASP, referentes à avaliação e mensuração de ativos e passivos do setor público: - Mensuração: é a constatação de valor monetário para itens do ativo e do passivo decorrente da aplicação de procedimentos técnicos suportados em análises qualitativas e quantitativas. EEAR – DIVISÃO DE ENSINO DE PÓS-FORMAÇÃO (DEPF) 54 / 79 CAA – GESTÃO PATRIMONIAL NO COMAER EEAR -Reavaliação: é a adoção do valor de mercado ou de consenso entre as partes para bens do ativo. - Redução ao valor recuperável: é a redução nos benefícios econômicos futuros ou no potencial de serviços de um ativo, que reflete um declínio na sua utilidade além do reconhecimento sistemático por meio da depreciação. - Valor de aquisição: é a soma do preço de compra de um bem com os gastos suportados direta ou indiretamente para colocá-lo em condição de uso. - Custo do ativo: é o montante gasto ou o valor necessário para adquirir um ativo na data da sua aquisição ou construção. - Valor líquido contábil: é o valor pelo qual um ativo é contabilizado após a dedução de qualquer depreciação acumulada e das perdas acumuladas por redução ao valor recuperável. - Valor depreciável: é o custo de um ativo, ou outra base que substitua o custo, menos o seu valor residual. - Valor residual de um ativo: é o valor estimado que a entidade obteria com a venda do ativo. - Vida útil: é o período durante o qual a entidade espera utilizar o ativo ou número de unidade de produção ou de unidades semelhantes que a entidade espera obter pela utilização do ativo. EEAR – DIVISÃO DE ENSINO DE PÓS-FORMAÇÃO (DEPF) EEAR CAA – GESTÃO PATRIMONIAL NO COMAER 55 /79 ➔ Procure, no conteúdo estudado, as palavras-chave que melhor representam o que foi estudado até aqui. ➔ Faça uma lista dessas palavras-chave seguida de um breve Vamos fazer algumas comentário. anotações! ➔ A partir da leitura delas, tente reconstruir o que foi visto. Parabéns por ter avançado até aqui! Está na hora de fazer uma pausa. Lembre-se de que o descanso e a reflexão fazem parte do estudo. Agora, que tal uma pausa? A partir de suas anotações, reconstrua, com suas palavras, todo o estudo em um ou dois parágrafos, ou, se preferir, elabore um mapa mental ou um infográfico sobre o texto. Está na hora de resumir! EEAR – DIVISÃO DE ENSINO DE PÓS-FORMAÇÃO (DEPF) 56 / 79 CAA – GESTÃO PATRIMONIAL NO COMAER EEAR Exercícios para Aprendizagem do Capítulo Bem, agora que você já cumpriu uma etapa da missão, que tal avaliar seu grau de assimilação em relação ao conteúdo visto até esse tópico? Não se preocupe caso não saiba responder prontamente. A proposta é que você consulte as suas anotações ou produza um debate com algum companheiro. Você pode usar o fórum entre pares no EEAR Virtual. O importante é que você resolva os exercícios abaixo. 1. Marque a alternativa que completa corretamente a frase a seguir: “O Patrimônio Público é estruturado nos seguintes grupos: _________, ________ e _________.”. a) Ativo – Passivo – Patrimônio Líquido b) Ativo – Potencial de Serviços – Benefícios Econômicos c) Ativo – Variação patrimonial aumentativa -Variação patrimonial diminutiva d) Passivo – Potencial de Serviços – Ativo 2. A liquidação da despesa orçamentária e a arrecadação da receita orçamentária são respectivamente exemplos de: a) Variação patrimonial aumentativa e Variação patrimonial diminutiva. b) Variação patrimonial aumentativa. c) Variação patrimonial diminutiva. d) Variação patrimonial diminutiva e Variação patrimonial aumentativa. 3. Marque a alternativa correta que contenha o conceito de Avaliação Patrimonial: a) a atribuição de valor monetário a itens do ativo e do passivo, decorrentes de julgamento fundamentado em consenso entre as partes e que traduza, com razoabilidade, a evidenciação dos atos e dos fatos administrativos b) é a constatação de valor monetário para itens do ativo e do passivo decorrente da aplicação de procedimentos técnicos suportados em análises qualitativas e quantitativas. c) é a adoção do valor de mercado ou de consenso entre as partes para bens do ativo. d) nenhuma das alternativas anteriores. _____________________________________________________________________________________ GABARITO 2–D 1–A 3–A EEAR – DIVISÃO DE ENSINO DE PÓS-FORMAÇÃO (DEPF) EEAR CAA – GESTÃO PATRIMONIAL NO COMAER 57 /79 6 BENS PATRIMONIAIS Agora que já vimos alguns conceitos e aspectos sobre o Patrimônio, precisamos conhecer um pouco sobre os Bens Patrimoniais. Que tal verificar em seu setor de trabalho o patrimônio relacionado a ela? Vamos seguir em frente! Bens patrimoniais são os bens que recebem tratamento de controle diferenciado, de acordo com sua previsão de durabilidade e valor, constituem o patrimônio público e se encontram sob a administração da Aeronáutica. Todos os bens patrimoniais de posse de qualquer Unidade Gestora (UG) da Aeronáutica pertencem à União. Dessa forma, faz-se necessária a correta administração dos bens patrimoniais, uma vez que a administração incorreta dos bens poderá ocasionar dano ao erário. Por esse motivo, é de extrema importância o controle dos bens móveis por parte das UGs do COMAER. O RCA 12-1 – “Regulamento de Administração da Aeronáutica, na forma eletrônica (RADA-e)” – prevê que a manutenção dos bens patrimoniais, móveis, imóveis ou intangíveis são de responsabilidade da UG, que mantém a sua guarda, conforme as normas contidas no RADA-e e nas demais legislações pertinentes à administração de bens patrimoniais, no âmbito do COMAER. Na União, os bens patrimoniais se dividem, quanto a sua natureza, dividem-se em: a) Móveis; b) Imóveis; e c) Intangíveis. 6.1 BENS MÓVEIS Os bens patrimoniais móveis dividem-se nas seguintes categorias: a) Bem móvel consumo; e b) Bem móvel de consumo de uso duradouro. EEAR – DIVISÃO DE ENSINO DE PÓS-FORMAÇÃO (DEPF) 58 / 79 CAA – GESTÃO PATRIMONIAL NO COMAER EEAR 6.2 BEM MÓVEL DE CONSUMO O RADA-e faz referência ao Manual de Contabilidade Aplicada ao Setor Público (MCASP) para definir um material como consumo de acordo com 5 (cinco) critérios. Caso o referido material atenda um, e, pelo menos, um dos critérios, ele será definido como bens móveis de consumo. a) Critérios para definição de classificação como material de consumo - 1º Critério: Durabilidade – se em uso normal, perde ou tem reduzidas as suas condições de funcionamento no prazo máximo de dois anos; - 2º Critério: Fragilidade – se sua estrutura for quebradiça, deformável ou danificável, caracterizando sua irrecuperabilidade e perda de sua identidade ou funcionalidade; - 3º Critério: Perecibilidade – se está sujeito as modificações (químicas ou físicas), ou se deteriora ou perde sua característica pelo uso normal; - 4º Critério: Incorporabilidade – se está destinado à incorporação a outro bem, e não pode ser retirado sem prejuízo das características físicas e funcionais do principal, pode ser utilizado para a constituição de novos bens, melhoria ou adições complementares de bens em utilização, ou para a reposição de peças para manutenção do seu uso normal que contenham a mesma configuração; - 5º Critério: Transformabilidade – se foi adquirido para fim de transformação. Exemplos de Materiais de Consumo: Álcool, gasolina, diesel e lubrificantes automotivos; combustível e lubrificantes de aviação; gás engarrafado; outros combustíveis e lubrificantes; Material biológico, farmacológico e laboratorial; gêneros de alimentação; material de construção para reparos em imóveis; material de manobra e patrulhamento; Material de proteção, segurança, socorro e sobrevivência; Material de expediente; material de cama e mesa, copa e cozinha, e produtos de higienização; Material gráfico e de processamento de dados; material para fotografia e filmagem; material para instalação elétrica e eletrônica; material para manutenção, reposição e aplicação; material para telecomunicações; Material odontológico, hospitalar e ambulatorial; material químico; EEAR – DIVISÃO DE ENSINO DE PÓS-FORMAÇÃO (DEPF) EEAR CAA – GESTÃO PATRIMONIAL NO COMAER 59 /79 Vestuário, uniformes, fardamento, tecidos e aviamentos; material de acondicionamento e embalagem; bandeiras, flâmulas e insígnias. Os bens móveis de consumo, quando em estoque, deverão ser escriturados. Os bens móveis permanentes, de consumo, de consumo de uso duradouro e reparáveis serão escriturados analiticamente nas organizações que diretamente os administram, por meio do SILOMS, tendo os seus valores contabilizados sinteticamente no SIAFI, em conformidade com o Plano de Contas da Administração Federal. 6.3 BENS DE CONSUMO E DE USO DURADOURO De acordo com o MCASP, Material de Consumo é aquele que, em razão de seu uso corrente e da definição da Lei nº 4.320/1964, perde normalmente sua identidade física e/ou tem sua utilização limitada a dois anos. Devido à durabilidade, quantidade utilizada ou valor relevante esse, bem poderá ser considerado como Consumo de Uso Duradouro, devendo ser incorporado ao patrimônio da Unidade e controlado por meio de relação de material carga. O MCASP esclarece com propriedade que, embora um bem tenha sido adquirido como permanente, o seu controle patrimonial deverá ser feito baseado na relação custo X benefício desse controle. Nesse sentido, a Constituição Federal prevê o princípio da economicidade (art.70), que se reflete na relação custo-benefício. Assim, os controles devem ser simplificados quando se apresentam como meramente formais ou se seu custo for claramente superior ao risco. Portanto, se um material for adquirido como permanente e ficar comprovado que possui custo de controle superior ao seu benefício, deve ser controlado de forma simplificada, por meio de relação carga, que mede apenas aspectos qualitativos e quantitativos, não havendo necessidade de controle por meio de número patrimonial. Exemplos de Materiais de Uso Duradouro: Grampeador, perfurador manual para encadernação, porta-documentos em acrílico, extrator de grampos, lixeira em inox, tesoura, porta-canetas em acrílico, dentre outros materiais que atendam aos critérios expostos acima. EEAR – DIVISÃO DE ENSINO DE PÓS-FORMAÇÃO (DEPF) 60 / 79 CAA – GESTÃO PATRIMONIAL NO COMAER EEAR ➔ Procure, no conteúdo estudado, as palavras-chave que melhor representam o que foi estudado até aqui. ➔ Faça uma lista dessas palavras-chave seguida de um breve comentário. Vamos fazer algumas ➔ A partir da leitura delas, tente reconstruir o que foi visto. anotações! Você consegue identificar os bens móveis de consumo de seu setor? E os bens de uso duradouro? Você saberia identificar o Gestor de Bens Patrimoniais Móveis de Consumo de sua Unidade? 6.4 ESCRITURAÇÃO DOS BENS DE CONSUMO E DE USO DURADOURO De acordo com o Manual Eletrônico de Administração de Bens Patrimoniais do RADA-e (Manual D – RADA-e), os bens móveis de consumo e de uso duradouro deverão ser escriturados de forma analítica nas Organizações que diretamente os administram, utilizado-se do Sistema Integrado de Logística de Material e Serviços (SILOMS) e de forma sintética no Sistema Integrado de Administração Financeira do Governo Federal (SIAFI), em conformidade com o Plano de Contas da Administração Federal. Conforme o Módulo 7 do Manual G (Execução Orçamentária, Financeira e Patrimonial) do RADA-e, os bens móveis de consumo, no Comando da Aeronáutica, serão contabilizados de acordo com seguintes categorias: a) Estoque Interno; b) Estoque de Distribuição; c) Estoque de Produtos para Venda; d) Estoque de Sobressalentes a Reparar; e) Estoque de Sobressalentes em Reparo; f) Estoque de Sobressalentes a Alienar; e g) Estoque em Armazém de Terceiros. EEAR – DIVISÃO DE ENSINO DE PÓS-FORMAÇÃO (DEPF) EEAR CAA – GESTÃO PATRIMONIAL NO COMAER 61 /79 Os procedimentos contábeis de entrada de material, aquisições, incorporações diversas e saída de materiais referentes às categorias elencadas acima estão descritos detalhadamente no Módulo 7 do Manual G do RADA-e. O agente designado para exercer a função de Gestor Patrimonial de Bens Móveis de Consumo é o responsável pela guarda e conservação dos bens escriturados em estoque. Por ocasião da prestação de contas, o gestor de Bens Móveis de Consumo deverá consolidar a escrituração sintética e analítica dos bens móveis de consumo estocados na própria UG e nas UG APOIADAS. A escrituração dos bens deverá ser submetida, de forma periódica, à supervisão por parte do Agente de Controle Interno e do Dirigente Máximo da UG ➔ Procure, no conteúdo estudado, as palavras-chave que melhor representam o que foi estudado até aqui. ➔ Faça uma lista dessas palavras-chave seguida de um breve comentário. Vamos fazer algumas ➔ A partir da leitura delas, tente reconstruir o que foi visto. anotações! Iniciaremos agora um assunto de grande importância e bastante reflexo no dia a dia dos setores. Falaremos sobre o Bem Móvel Permanente e algumas de suas características. Pronto para conhecer mais um pouco da Gestão Patrimonial do COMAER? EEAR – DIVISÃO DE ENSINO DE PÓS-FORMAÇÃO (DEPF) 62 / 79 CAA – GESTÃO PATRIMONIAL NO COMAER EEAR 6.5 BEM MÓVEL PERMANENTE De acordo com o MCASP, é o material que, em razão de seu uso corrente, não perde a identidade física e/ou tem uma durabilidade superior a dois anos. Seguindo a determinação do Manual Eletrônico de Administração de Bens Patrimoniais do RADA-e, o bem móvel permanente (BMP) deverá ser etiquetado sempre que possível, de maneira a permitir sua pronta identificação, facilitando o controle e as realizações de inventários. As etiquetas de identificação serão geradas no SILOMS, módulo BMP, desde que o bem esteja devidamente escriturado no Sistema. Exemplos de Materiais Permanentes: ➔ mesas, computadores, estantes de aço, armários, aparelhos de ar-condicionado, impressoras, fornos combinados, refrigeradores, televisores dentre outros materiais que atendam aos critérios expostos acima. 6.6 ESCRITURAÇÃO DOS BENS MÓVEIS PERMANENTES Os bens móveis permanentes serão escriturados analiticamente nas organizações que diretamente os administram, por meio do SILOMS, tendo seus valores contabilizados sinteticamente no SIAFI, conforme o Plano de Contas da Administração Federal de acordo com o previsto no Manual Eletrônico. A escrituração dos bens deverá ser submetida, de forma periódica, à supervisão por parte do Agente de Controle Interno e do Dirigente Máximo da UG. De acordo com o módulo 7 do Manual G (Execução Orçamentária, Financeira e Patrimonial) do RADA-e, os BMP serão escriturados nas contas contábeis do grupo 1.2.3.1.1.XX.YY – BENS MÓVEIS, admitindo-se as seguintes situações: a) bens móveis permanentes em uso; b) bens móveis em almoxarifado – estoque interno; c) bens móveis em almoxarifado – estoque de distribuição; d) bens móveis a reparar; e) bens móveis em reparo; f) bens móveis a alienar; EEAR – DIVISÃO DE ENSINO DE PÓS-FORMAÇÃO (DEPF) EEAR CAA – GESTÃO PATRIMONIAL NO COMAER 63 /79 g) bens móveis em poder de outra unidade ou terceiros; e h) bens móveis em elaboração. Os procedimentos contábeis de entrada e saída de bens referentes às categorias elencadas acima estão descritos detalhadamente no Módulo 7 do Manual G do RADA-e. A consolidação dos registros sintéticos e analíticos dos BMP são de responsabilidade da UG apoiadora por meio do Gestor Patrimonial de Bens Móveis Permanentes. 6.7 DEPRECIAÇÃO DOS BENS MÓVEIS PERMANENTES De acordo com o Manual de Contabilidade Aplicada ao Setor Público, depreciação é a redução do valor dos bens tangíveis pelo desgaste ou perda de utilidade por uso, ação da natureza ou obsolescência, ocasionada pelos seguintes fatores: I. deterioração física; II. desgastes com uso; e III. obsolescência. Os ativos imobilizados estão sujeitos à depreciação no decorrer da sua vida útil. A manutenção adequada desses ativos não interfere na aplicação da depreciação. A apuração da depreciação deverá ser feita mensalmente, a partir do momento em que o item do ativo se tornar disponível para uso, ou seja, quando está no local e em condição de funcionamento na forma pretendida pela administração. Dessa forma, nas unidades do COMAER, a depreciação dos Bens Móveis Permanentes é realizada mensalmente. Essa depreciação é escriturada tanto pelo sistema analítico, o SILOMS, quanto pelo sistema sintético, o SIAFI. No contexto atual das Organizações Militares do Comando da Aeronáutica, temos as Unidades Apoiadas e as Unidades Apoiadoras. Nessa conjuntura, as despesas de depreciação dos bens móveis permanentes em uso da UNIDADE APOIADA serão contabilizadas pela respectiva UNIDADE APOIADORA, com base em relatórios mensais produzidos pelo SILOMS (Módulo BMP), conforme disposto no Módulo 7 do Manual G do RADA-e. EEAR – DIVISÃO DE ENSINO DE PÓS-FORMAÇÃO (DEPF) 64 / 79 CAA – GESTÃO PATRIMONIAL NO COMAER EEAR 6.8 BENS IMÓVEIS Bens imóveis são aqueles que não podem ser removidos sem destruição, alteração ou perda de sua forma, ou substância. São bens imóveis o solo e tudo quanto se lhe incorporar, natural ou artificialmente. Para fins notariais, imóvel é aquele objeto de uma matrícula, sendo o registro imprescindível para o pleno exercício da propriedade. A localização das benfeitorias de uma OM é regulada por seu Plano Diretor. As alterações ocorridas nos valores dos bens patrimoniais imóveis, em razão de reforma, recuperação ou conservação, que resultem em aumento relevante da vida útil do bem, serão objeto de publicação em boletim interno e de registro no SIAFI, para a devida incorporação destes valores ao patrimônio do COMAER. A Diretoria de Infraestrutura (DIRINFRA), é o Órgão Central do Sistema de Patrimônio da Aeronáutica e possui a responsabilidade de manter o registro cadastral atualizado de todos os bens imóveis sob responsabilidade do COMAER. Os Destacamentos de Infraestrutura (DT-INFRA), Órgãos Regionais do Sistema de Patrimônio, possuem a tarefa de manter, em ordem e em dia, os registros cadastrais dos bens imóveis referentes às UG de sua responsabilidade e contabilizar as alterações (incorporações, transferências, avaliações, reavaliações ou baixas) no Sistema de Gerenciamento dos Imóveis de Uso Especial – SPIUnet. 6.9 BENS INTANGÍVEIS De acordo com o Módulo 7 do Manual G do RADA-e que faz referência ao MCASP, o Ativo Intangível é definido como: a) não monetário; b) sem substância física; c) identificável; d) controlado pela entidade; e e) gerador de benefícios econômicos futuros ou serviços potenciais. EEAR – DIVISÃO DE ENSINO DE PÓS-FORMAÇÃO (DEPF) EEAR CAA – GESTÃO PATRIMONIAL NO COMAER 65 /79 O Bem Intangível é definido como “Identificável” necessariamente quando: - for separável, ou seja, a instituição pode dispor desse bem, sob a forma de alienação, empréstimo, cessão de uso, transferência, aluguel, troca ou venda; ou - resultar de compromissos obrigatórios. Segundo o Manual D do RADA-e, são ativos intangíveis, dentre outros: a) Royalties; b) Patentes, direitos autorais e outros direitos de propriedade industrial, de serviços e operacionais; c) Softwares, licenças; d) Modelos, projetos, protótipos e ativos intangíveis em desenvolvimento; e e) Bens culturais imateriais. 6.10 AMORTIZAÇÃO DE BENS INTANGÍVEIS De acordo com o Módulo 7 do Manual G do RADA-e, a amortização é prevista pelas Normas Brasileiras de Contabilidade Aplicadas ao Setor Público – NBC TSP 08 – Ativo Intangível – que consiste na alocação sistemática do valor amortizável do ativo intangível ao longo da sua vida útil, com existência ou exercício de duração limitada, ou cujo objeto sejam bens de utilização por prazo legal ou contratualmente limitado, obedecidas às quotas mensais e constantes de amortização, obtidas por meio da seguinte fórmula: Valor Atual – Valor Residual Vida Útil Econômica Sendo: a) Valor Atual: corresponde ao valor de aquisição e somente será alterado em virtude de reavaliação ou de redução ao valor recuperável; b) Valor Residual: é o valor que a entidade espera, com razoável segurança, obter por um ativo no fim de sua vida útil econômica, deduzidos os gastos esperados para sua alienação; e c) Vida Útil Econômica: é o período de tempo definido ou estimado tecnicamente, durante o qual se espera obter fluxos de benefícios futuros de um ativo. Os registros contábeis mensais de amortização serão realizados de forma automática, através da integração SIAFI x SILOMS. O Gestor de Registro é o agente responsável por essa tarefa seguindo as orientações contidas no Manual. EEAR – DIVISÃO DE ENSINO DE PÓS-FORMAÇÃO (DEPF) 66 / 79 CAA – GESTÃO PATRIMONIAL NO COMAER EEAR Parabéns por ter avançado até aqui! Está na hora de fazer uma pausa. Lembre-se de que o descanso e a reflexão fazem parte do estudo. Agora, que tal uma pausa? A partir de suas anotações, reconstrua, com suas palavras, todo o estudo em um ou dois parágrafos, ou, se preferir, elabore um mapa mental ou um infográfico sobre o texto. Está na hora de resumir! EEAR – DIVISÃO DE ENSINO DE PÓS-FORMAÇÃO (DEPF) EEAR CAA – GESTÃO PATRIMONIAL NO COMAER 67 /79 Exercícios para Aprendizagem do Capítulo Bem, agora que você já cumpriu uma etapa da missão, que tal avaliar seu grau de assimilação em relação ao conteúdo visto até esse tópico? Não se preocupe caso não saiba responder prontamente. A proposta é que você consulte as suas anotações ou produza um debate com algum companheiro. Você pode usar o fórum entre pares no EEAR Virtual. O importante é que você resolva os exercícios abaixo. 1. Indique a alternativa que completa corretamente as lacunas do seguinte texto: “Os bens patrimoniais se dividem, quanto a sua natureza, em 3 (três): __________,__________ e __________.”. a) Consumo – Imóveis – Reparável b) Móveis – Consumo – Intangíveis c) Consumo – Reparável – Móveis d) Móveis – Imóveis – Intangíveis 2. Marque a alternativa que contenha 2 (dois) critérios para definição de material de consumo. a) Durabilidade e Reparabilidade b) Transformabilidade e Consumo c) Fragilidade e Durabilidade d) Transformabilidade e Intangibilidade 3. Marque a alternativa que contenha o item que possui a definição a seguir: “É o material que, em razão de seu uso corrente, não perde a identidade física, e/ou tem uma durabilidade superior a dois anos”. a) Bens Intangíveis b) Bem Móvel Permanente c) Bem Móvel de Consumo de Uso Duradouro d) Bem Móvel de Consumo _____________________________________________________________________________________ GABARITO 1–D 2–C 3–B EEAR – DIVISÃO DE ENSINO DE PÓS-FORMAÇÃO (DEPF) 7 MOVIMENTAÇÕES E PROCEDIMENTOS DE DESFAZIMENTO DOS BENS MÓVEIS PERMANENTES Vimos os bens móveis de consumo de uso duradouro, os bens intangíveis e os bens móveis permanentes. Agora você consegue estabelecer uma comparação entre eles? Liste as similaridades e as diferenças entre eles. Vamos em frente! Por se tratarem de fatos administrativos, todas as movimentações relativas aos materiais permanentes deverão ser precedidas de Processos Administrativos e deverão ser escrituradas nos sistemas de gestão e controle do COMAER, tanto o sistema analítico quanto o sintético. As movimentações de materiais também deverão estar de acordo com os procedimentos previstos, tanto no Regulamento de Administração da Aeronáutica quanto nos procedimentos do Módulo 7 do Manual G do RADA-e e demais legislações afins. De acordo com o Manual D do RADA-e, a inclusão, atualização, avaliação, reavaliação, transferência, descarga, exclusão ou o desfazimento dos BMP serão objeto de publicação em boletim interno em até 15 (quinze) dias úteis. A movimentação dos BMP no SILOMS será de responsabilidade da UG detentora do bem, cabendo a UG Apoiadora o registro da movimentação no SIAFI. Cabe ressaltar que movimentações internas em uma UG não implicarão reflexos contábeis a serem registrados no SIAFI. A exclusão ou desfazimento dos BMP será originado por processo regular, no qual constarão a nomenclatura completa, as quantidades, as datas do recebimento, os valores e o motivo da exclusão. A seguir, estão os itens 2.14.8 ao 2.14.8.2, extraídos do Manual Eletrônico de Administração de Bens Patrimoniais (Manual d do RADA-e) sobre desfazimento de BMP: “ 2.14.8 O desfazimento dos bens patrimoniais móveis permanentes deverá será precedido de: 2.14.8.1 Exame do material: a) Para o bem que tiver completado o tempo mínimo de duração presumível nas respectivas tabelas e que não mais esteja em condições de ser utilizado; b) Para aquele bem que, por motivo de força maior ou caso fortuito, tenha se tornado imprestável antes de completar o seu tempo mínimo presumível de duração, ou quando não haja tempo de duração fixado; c) Para o bem inservível ao fim a que se destina, não sendo suscetível de reparação ou recuperação; d) Para o bem que se pretenda alienar, por se achar disponível e sem probabilidade de aplicação próxima ou remota; e) Para o bem cuja recuperação ou alienação for considerada antieconômica ou inconveniente, em razão dos custos envolvidos; e f) Para o bem deteriorado ou inutilizado em depósito, resultante de incúria, imprudência ou imprevidência dos responsáveis. 2.14.8.1.1 No Exame de Material, o bem poderá ser classificado como: a) Ocioso – quando, em perfeitas condições de uso, não estiver sendo aproveitado pela OM; b) Recuperável – quando sua recuperação for possível e indicada em razão de o custo da recuperação ser de até 50% (cinquenta por cento) do seu valor de mercado, ou cuja análise de custo e benefício demonstre ser justificável a sua recuperação; c) Antieconômico – quando sua manutenção for onerosa ou seu rendimento precário, em virtude de uso prolongado, desgaste prematuro ou obsoletismo, mediante justificativa formal; e d) Irrecuperável – quando não mais puder ser utilizado para o fim a que se destina, devido à perda de suas características ou em razão de ser o seu custo de recuperação mais de 50% (cinquenta por cento) do seu valor de mercado ou de a análise do seu custo e benefício demonstrar ser injustificável a sua recuperação, mediante justificativa formal. 2.14.8.2 Exame de causas: a) Para o bem extraviado ou desaparecido; e b) Para o bem extorquido, roubado, furtado ou saqueado.” A decisão sobre o destino de um bem móvel permanente é de responsabilidade do Dirigente Máximo da UG. Para isso, no Termo de Exame de Material ou de Causas serão evidenciadas e registradas as ocorrências, as circunstâncias e outros esclarecimentos julgados necessários para a decisão da Autoridade. O Termo é documento formal para amparar as baixas patrimoniais e deverá ser emitido independentemente dos procedimentos administrativos competentes para responsabilização, os quais, no entanto, podem servir de subsídios. Tomando por base o Termo de Exame, o Dirigente Máximo da UG detentora do bem decidirá conforme opções abaixo: a) Imputar prejuízo à União ou responsabilizar o culpado; b) Mandar excluir do patrimônio e dar baixa na escrituração ou recuperar o bem; e c) Indicar o destino a ser dado ao bem, determinando a abertura de processo de alienação ou outra forma de desfazimento, mediante inutilização ou abandono. Para os casos de desfazimento, mediante inutilização ou abandono, deverá ser lavrado Termo de Inutilização ou Termo de Abandono, os quais integrarão o respectivo processo de desfazimento. Em caso de o material ser classificado como ocioso ou recuperável, poderá ser cedido a outros órgãos que dele necessitem, mediante Termo de Cessão, no qual constarão a indicação de transferência de carga patrimonial, da unidade cedente para a cessionária, e o valor de aquisição ou custo de produção. 7.1 ALIENAÇÃO DE BENS MÓVEIS PERMANENTES As orientações a seguir foram extraídas do Manual D do RADA-e referente à alienação de BMP. Os bens móveis inservíveis ou excluídos, bem como a matéria-prima aproveitável, oriunda de exclusão, sempre que não tiverem aplicação na OM e desde que não haja interessados de outras UG, serão alienados, com a devida autorização do Dirigente Máximo da UG, de acordo com os procedimentos descritos Módulo 07 do Manual de Execução Orçamentária, Financeira e Patrimonial do RADA-e. Nenhum material poderá ser alienado sem prévia destituição de suas características eminentemente militares. O material destinado à alienação deverá estar descaracterizado para resguardar o COMAER de qualquer responsabilidade por danos materiais ou pessoais decorrentes de utilizações indevidas, ou inapropriadas por parte de terceiros. A alienação de bens, conforme art 76. da Lei 14.133/2021, será subordinada à existência de interesse público devidamente justificado, será precedida de avaliação. Os bens móveis inservíveis ociosos e os recuperáveis poderão ser reaproveitados, mediante transferência interna (quando realizada entre unidades organizacionais, dentro do mesmo órgão ou entidade) ou externa (quando realizada entre órgãos da União). Os bens móveis inservíveis cujo reaproveitamento seja considerado inconveniente ou inoportuno serão alienados conforme a legislação aplicável às licitações e aos contratos, no âmbito da administração pública. A avaliação do bem a ser alienado será realizada por comissão, especificamente designada, de, no mínimo, três membros, cujo resultado será registrado em termo próprio. A documentação relativa à alienação de bens patrimoniais deverá, obrigatoriamente, compor PAG aberto exclusivamente para tal fim, a ser arquivado no Módulo e-PAG, do SILOMS. A comissão de avaliação deverá conter, entre seus membros, pelo menos um com conhecimento técnico-especializado do bem, a quem caberá a assessoria pelo termo de avaliação. O Termo de Avaliação é parte constitutiva do processo de alienação. Os valores arrecadados nas alienações destinam-se ao Fundo Aeronáutico, na forma da legislação pertinente. Na hipótese de se tratar de bem móvel inservível, a doação permitida exclusivamente para fins e uso de interesse social, após avaliação de sua oportunidade e conveniência socioeconômica, relativamente à escolha de outra forma de alienação, poderá ser feita em favor: a) da União, de suas autarquias e de suas fundações públicas; b) das empresas públicas federais ou das sociedades de economia mista federais prestadoras de serviço público, desde que a doação se destine à atividade fim por elas prestada; c) dos Estados, do Distrito Federal e dos Municípios e de suas autarquias e fundações públicas; d) de organizações da sociedade civil, incluídas as organizações sociais a que se refere a Lei nº 9.637, de 15 de maio de 1998, e as organizações da sociedade civil de interesse público a que se refere a Lei nº 9.790, de 23 de março de 1999; e) de associações e de cooperativas que atendam aos requisitos previstos no Decreto nº 5.940, de 25 de outubro de 2006. 7.2 COMPROVAÇÃO DOS BENS MÓVEIS PERMANENTES NAS UG DO COMAER Conforme orientações contidas no Manual Eletrônico de Administração dos Bens Patrimoniais: Os bens patrimoniais móveis, assim como os bens culturais, adquiridos, fabricados, recebidos em doação ou cessão serão incluídos no patrimônio, sendo contabilizados com base no documento correspondente, registrando-se a nomenclatura detalhada do material, quantidade, valor unitário e valor total. Esses bens serão escriturados na conta contábil apropriada do SIAFI e no SILOMS. O bem móvel permanente em uso na UG será etiquetado sempre que possível, de maneira a permitir a sua pronta identificação, facilitando a conferência física e os controles necessários. Os BMP escriturados no sistema SILOMS devem representar fielmente os materiais físicos de posse das diversas seções dentro de uma Organização Militar. É de responsabilidade dos Detentores da Carga o controle do material existente no seu setor de trabalho. O controle do material deve ser realizado de forma que os BMP escriturados no SILOMS represente, com exatidão, o material físico existente no setor. Vale ressaltar que BMP em excesso e/ou sem identificação representam irregularidade no controle de bens permanentes. O inventário físico anual está previsto no Manual Eletrônico de Administração de Bens Patrimoniais, devendo ser realizado até ao final de cada exercício financeiro, a fim de verificar a existência dos bens registrados e a exatidão dos registros e saldos no sistema de controle patrimonial. O inventário deverá ser realizado por comissões de, no mínimo, três membros, nomeados pelo Dirigente Máximo da UG. Por fim, vale ressaltar que, caso as comissões identifiquem discrepâncias no material carga, a autoridade competente deverá adotar as medidas administrativas cabíveis para a apuração de responsabilidades. ➔ Procure, no conteúdo estudado, as palavras-chave que melhor representam o que foi estudado até aqui. ➔ Faça uma lista dessas palavras-chave seguida de um breve comentário. Vamos fazer algumas ➔ A partir da leitura delas,